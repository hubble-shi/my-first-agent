<script id="book-data" type="application/json">{"version":"3.2","date":"2026-11-07","modules":[{"number":0,"id":"m00","title":"怎样使用这本手册","goal":"选择首次通读或每日路线，知道每次读到哪里就可以停。","questions":[],"sections":[{"title":"00.1 这次重写的阅读约定","id":"001-这次重写的阅读约定","search":"00.1 这次重写的阅读约定 正文对应现在的源码。代码摘录帮助你沿路径阅读，教学示例用来手推，后续扩展单独放在第 13 章。"},{"title":"00.2 首次读一遍只走主线","id":"002-首次读一遍只走主线","search":"00.2 首次读一遍只走主线 1. 看 01，画出用户、CLI、Agent、模型、工具之间的箭头。\n2. 看 03 → 05，理解程序怎样启动，工具怎样变成说明书。\n3. 看 06，用纸写出一次调用两个工具后的完整消息顺序。\n4. 看 12，挑一个失败用例。先预测，再跑离线自测，最后解释断言。\n5. 看 14，练三十秒介绍。读到陌生语法时随时回到 02。"},{"title":"00.3 每天一次最小学习循环","id":"003-每天一次最小学习循环","search":"00.3 每天一次最小学习循环 每天挑一节，先花一分钟回忆上次学到的函数。读完后做 A、B 各一题，再对照代码核对。能独立说出**输入、状态变化、输出、一个边界**，今天就可以停。"},{"title":"00.4 题库怎样用","id":"004-题库怎样用","search":"00.4 题库怎样用 01–12 各有 12 题。A 解释对象与语法，B 预测实际行为，C 说明设计选择与边界。先自己说一遍再展开答案。读过题目和能独立推演是两种进度。"},{"title":"00.5 跳转与阅读方式","id":"005-跳转与阅读方式","search":"00.5 跳转与阅读方式 Markdown 目录可以跳到章节和小节。带侧栏的 HTML 版还支持搜索、难度筛选、继续上次和十四次复习路线。复习勾选保存在浏览器本地，换浏览器或路径时进度可能另算。"}],"heading":"00 怎样使用这本手册","slug":"00-怎样使用这本手册","line":30,"html":"\u003ch3 id=\"001-这次重写的阅读约定\">00.1 这次重写的阅读约定\u003c/h3>\n\u003cp>正文对应现在的源码。代码摘录帮助你沿路径阅读，教学示例用来手推，后续扩展单独放在第 13 章。\u003c/p>\n\u003ch3 id=\"002-首次读一遍只走主线\">00.2 首次读一遍只走主线\u003c/h3>\n\u003col>\n\u003cli>看 01，画出用户、CLI、Agent、模型、工具之间的箭头。\u003c/li>\n\u003cli>看 03 → 05，理解程序怎样启动，工具怎样变成说明书。\u003c/li>\n\u003cli>看 06，用纸写出一次调用两个工具后的完整消息顺序。\u003c/li>\n\u003cli>看 12，挑一个失败用例。先预测，再跑离线自测，最后解释断言。\u003c/li>\n\u003cli>看 14，练三十秒介绍。读到陌生语法时随时回到 02。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"003-每天一次最小学习循环\">00.3 每天一次最小学习循环\u003c/h3>\n\u003cp>每天挑一节，先花一分钟回忆上次学到的函数。读完后做 A、B 各一题，再对照代码核对。能独立说出\u003cstrong>输入、状态变化、输出、一个边界\u003c/strong>，今天就可以停。\u003c/p>\n\u003ch3 id=\"004-题库怎样用\">00.4 题库怎样用\u003c/h3>\n\u003cp>01–12 各有 12 题。A 解释对象与语法，B 预测实际行为，C 说明设计选择与边界。先自己说一遍再展开答案。读过题目和能独立推演是两种进度。\u003c/p>\n\u003ch3 id=\"005-跳转与阅读方式\">00.5 跳转与阅读方式\u003c/h3>\n\u003cp>Markdown 目录可以跳到章节和小节。带侧栏的 HTML 版还支持搜索、难度筛选、继续上次和十四次复习路线。复习勾选保存在浏览器本地，换浏览器或路径时进度可能另算。\u003c/p>\n"},{"number":1,"id":"m01","title":"项目架构与一条任务的数据流","goal":"画出入口、核心、模型与工具之间的数据流。","questions":[{"id":"m01-a01","module":1,"level":"A","number":1,"question":"入口、核心和工具各负责什么？","answer":"入口读配置并显示。核心负责请求、校验、执行与历史。工具各自完成实际业务动作。","followup":"","heading":"M01-A01 基础识别","anchor":"m01-a01-基础识别","answerHtml":"\u003cp>入口读配置并显示。核心负责请求、校验、执行与历史。工具各自完成实际业务动作。\u003c/p>\n","followupHtml":""},{"id":"m01-a02","module":1,"level":"A","number":2,"question":"模型如何知道可以调用哪些工具？","answer":"请求的 tools 字段包含可序列化的 Schema。模型返回调用意图，本地才用函数表找到真实 Python 函数。","followup":"","heading":"M01-A02 基础识别","anchor":"m01-a02-基础识别","answerHtml":"\u003cp>请求的 tools 字段包含可序列化的 Schema。模型返回调用意图，本地才用函数表找到真实 Python 函数。\u003c/p>\n","followupHtml":""},{"id":"m01-a03","module":1,"level":"A","number":3,"question":"项目使用了 SDK，它还算手写框架吗？","answer":"SDK 负责请求与响应格式；工具注册、调度、消息历史、执行回传、重试和事件由项目实现。","followup":"","heading":"M01-A03 基础识别","anchor":"m01-a03-基础识别","answerHtml":"\u003cp>SDK 负责请求与响应格式；工具注册、调度、消息历史、执行回传、重试和事件由项目实现。\u003c/p>\n","followupHtml":""},{"id":"m01-a04","module":1,"level":"A","number":4,"question":"两个应用为什么共用一个 Agent？","answer":"任务的请求循环相同。应用层分别提供角色提示和工具列表。","followup":"","heading":"M01-A04 基础识别","anchor":"m01-a04-基础识别","answerHtml":"\u003cp>任务的请求循环相同。应用层分别提供角色提示和工具列表。\u003c/p>\n","followupHtml":""},{"id":"m01-b01","module":1,"level":"B","number":1,"question":"一次输入收到两次模型响应、三个工具调用，怎样计数？","answer":"一次用户回合、两轮逻辑请求、三次工具执行。底层请求尝试还要加网络重试。","followup":"","heading":"M01-B01 代码推演","anchor":"m01-b01-代码推演","answerHtml":"\u003cp>一次用户回合、两轮逻辑请求、三次工具执行。底层请求尝试还要加网络重试。\u003c/p>\n","followupHtml":""},{"id":"m01-b02","module":1,"level":"B","number":2,"question":"把天气工具换成文件工具，核心要懂路径吗？","answer":"工具在应用层绑定工作区和检查路径。核心通过统一的参数与结果接口调用。","followup":"","heading":"M01-B02 代码推演","anchor":"m01-b02-代码推演","answerHtml":"\u003cp>工具在应用层绑定工作区和检查路径。核心通过统一的参数与结果接口调用。\u003c/p>\n","followupHtml":""},{"id":"m01-b03","module":1,"level":"B","number":3,"question":"两个 Agent 用同一个工作区会怎样？","answer":"各有自己的历史，但两个工具组都可能操作同一份磁盘文件。","followup":"","heading":"M01-B03 代码推演","anchor":"m01-b03-代码推演","answerHtml":"\u003cp>各有自己的历史，但两个工具组都可能操作同一份磁盘文件。\u003c/p>\n","followupHtml":""},{"id":"m01-b04","module":1,"level":"B","number":4,"question":"重启后，哪部分还能看到？","answer":"实际文件和 JSONL 日志保留。当前会话的 messages 只在内存里，重启要重新开始。","followup":"","heading":"M01-B04 代码推演","anchor":"m01-b04-代码推演","answerHtml":"\u003cp>实际文件和 JSONL 日志保留。当前会话的 messages 只在内存里，重启要重新开始。\u003c/p>\n","followupHtml":""},{"id":"m01-c01","module":1,"level":"C","number":1,"question":"不用 LangGraph，自己获得了什么练习？","answer":"能亲手推导模型请求、工具执行和消息协议，同时要自行处理出错、重试和状态边界。","followup":"FitBot 使用 LangGraph 时，哪些工具边界仍需由你定义？","heading":"M01-C01 面试追问","anchor":"m01-c01-面试追问","answerHtml":"\u003cp>能亲手推导模型请求、工具执行和消息协议，同时要自行处理出错、重试和状态边界。\u003c/p>\n","followupHtml":"\u003cp>FitBot 使用 LangGraph 时，哪些工具边界仍需由你定义？\u003c/p>\n"},{"id":"m01-c02","module":1,"level":"C","number":2,"question":"两个应用共用内核，足够证明能扩展吗？","answer":"这是本地函数接入的一条证据。复杂参数、远程工具、权限和并发还需要单独的接口与用例。","followup":"","heading":"M01-C02 面试追问","anchor":"m01-c02-面试追问","answerHtml":"\u003cp>这是本地函数接入的一条证据。复杂参数、远程工具、权限和并发还需要单独的接口与用例。\u003c/p>\n","followupHtml":""},{"id":"m01-c03","module":1,"level":"C","number":3,"question":"应如何向面试官交代当前验证范围？","answer":"说明离线测试验证运行时和协议，真实模型是否选对工具以及任务成功率需要另外验证。","followup":"","heading":"M01-C03 面试追问","anchor":"m01-c03-面试追问","answerHtml":"\u003cp>说明离线测试验证运行时和协议，真实模型是否选对工具以及任务成功率需要另外验证。\u003c/p>\n","followupHtml":""},{"id":"m01-c04","module":1,"level":"C","number":4,"question":"给 Agent 接入外部工具，先检查什么？","answer":"参数结构、授权、失败语义、超时、结果大小与日志边界；先验证能否保留工具调用 ID。","followup":"远程调用成功但本地没收到结果，重试会怎样？","heading":"M01-C04 面试追问","anchor":"m01-c04-面试追问","answerHtml":"\u003cp>参数结构、授权、失败语义、超时、结果大小与日志边界；先验证能否保留工具调用 ID。\u003c/p>\n","followupHtml":"\u003cp>远程调用成功但本地没收到结果，重试会怎样？\u003c/p>\n"}],"sections":[{"title":"01.1 项目究竟做了什么","id":"011-项目究竟做了什么","search":"01.1 项目究竟做了什么 MiniAgent 把模型给出的工具请求转成 Python 函数调用，再把结果作为上下文交回模型。演示助手提供四个小工具，编程助手提供文件操作。两者共用同一个 `Agent`。\n\n面试时可以说「我手写了一个 ReAct 风格的工具调用循环」。模型选择下一步行动，Python 执行工具，工具结果作为新的观察交回模型，模型再决定继续调用还是回答。ReAct 原论文让模型交替生成显式推理轨迹和动作。MiniAgent 用结构化的 `tool_calls` 表达动作，终端显示的是程序实际执行的步骤。 [ReAct 论文](https://arxiv.org/abs/2210.03629)"},{"title":"01.2 先看职责，再看文件","id":"012-先看职责再看文件","search":"01.2 先看职责，再看文件 ```text\n用户 ↔ main.py / main_coding.py → cli.py\n                                      ↓ 注入请求函数、模型名和工具列表\n                                  core/agent.py\n                                  ↙           ↘\n                    SDK → DeepSeek             apps/ 下的 Python 函数\n                    retry.py 包装请求            工作区路径检查与本地 I/O\n                                      ↓\n                         logger.py 记录关键事件\n```\n\n| 先读哪个文件 | 对它提的问题 |\n|---|---|\n| [cli.py](../MiniAgent/cli.py) | 谁读配置，谁创建 SDK 客户端，谁负责显示？ |\n| [core/agent.py](../MiniAgent/core/agent.py) | 谁保存历史、验证参数、决定下一轮？ |\n| [apps/assistant.py](../MiniAgent/apps/assistant.py) | 一次普通的算术工具调用怎样返回？ |\n| [apps/coding_agent.py](../MiniAgent/apps/coding_agent.py) | 文件工具用哪个目录，哪些路径会被拒绝？ |\n| [selftest.py](../MiniAgent/selftest.py) | 怎样绕开付费请求，验证一轮消息是否配对？ |\n\n[源码 · cli.py · main](../MiniAgent/cli.py#L43)"},{"title":"01.3 一条任务经过哪些数据","id":"013-一条任务经过哪些数据","search":"01.3 一条任务经过哪些数据 你问「先计算 2+3，再查本机时间」。程序把用户消息和工具说明发给模型。模型可以回两个调用，每个包含函数名、参数 JSON 文本和调用 ID。程序解析参数、按顺序执行并回填两个结果。模型收到新历史后回答，CLI 显示文本。"},{"title":"01.4 状态到底放在哪里","id":"014-状态到底放在哪里","search":"01.4 状态到底放在哪里 `agent.messages` 是单个会话的列表。`agent.tools` 是可调用函数表，`agent.schemas` 是发给模型的说明列表。编程工具的闭包保存工作区，日志记录事件。退出进程后，已写的文件和日志还能查，消息历史随实例消失。"},{"title":"01.5 这套抽象怎么评价","id":"015-这套抽象怎么评价","search":"01.5 这套抽象怎么评价 新增一个同类型本地工具，可以用 `@tool` 生成说明，再把函数传给 Agent。更换模型传输则可以换 `complete`。面试时把这两个变化举成例子，再说明当前只处理同步、串行工具，单实例面向一个交互会话。"}],"heading":"01 项目架构与一条任务的数据流","slug":"01-项目架构与一条任务的数据流","line":64,"html":"\u003ch3 id=\"011-项目究竟做了什么\">01.1 项目究竟做了什么\u003c/h3>\n\u003cp>MiniAgent 把模型给出的工具请求转成 Python 函数调用，再把结果作为上下文交回模型。演示助手提供四个小工具，编程助手提供文件操作。两者共用同一个 \u003ccode>Agent\u003c/code>。\u003c/p>\n\u003cp>面试时可以说「我手写了一个 ReAct 风格的工具调用循环」。模型选择下一步行动，Python 执行工具，工具结果作为新的观察交回模型，模型再决定继续调用还是回答。ReAct 原论文让模型交替生成显式推理轨迹和动作。MiniAgent 用结构化的 \u003ccode>tool_calls\u003c/code> 表达动作，终端显示的是程序实际执行的步骤。 \u003ca href=\"https://arxiv.org/abs/2210.03629\">ReAct 论文\u003c/a>\u003c/p>\n\u003ch3 id=\"012-先看职责再看文件\">01.2 先看职责，再看文件\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">用户 ↔ main.py / main_coding.py → cli.py\n                                      ↓ 注入请求函数、模型名和工具列表\n                                  core/agent.py\n                                  ↙           ↘\n                    SDK → DeepSeek             apps/ 下的 Python 函数\n                    retry.py 包装请求            工作区路径检查与本地 I/O\n                                      ↓\n                         logger.py 记录关键事件\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>先读哪个文件\u003c/th>\n\u003cth>对它提的问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"../MiniAgent/cli.py\">cli.py\u003c/a>\u003c/td>\n\u003ctd>谁读配置，谁创建 SDK 客户端，谁负责显示？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../MiniAgent/core/agent.py\">core/agent.py\u003c/a>\u003c/td>\n\u003ctd>谁保存历史、验证参数、决定下一轮？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../MiniAgent/apps/assistant.py\">apps/assistant.py\u003c/a>\u003c/td>\n\u003ctd>一次普通的算术工具调用怎样返回？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../MiniAgent/apps/coding_agent.py\">apps/coding_agent.py\u003c/a>\u003c/td>\n\u003ctd>文件工具用哪个目录，哪些路径会被拒绝？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../MiniAgent/selftest.py\">selftest.py\u003c/a>\u003c/td>\n\u003ctd>怎样绕开付费请求，验证一轮消息是否配对？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../MiniAgent/cli.py#L43\">源码 · cli.py · main\u003c/a>\u003c/p>\n\u003ch3 id=\"013-一条任务经过哪些数据\">01.3 一条任务经过哪些数据\u003c/h3>\n\u003cp>你问「先计算 2+3，再查本机时间」。程序把用户消息和工具说明发给模型。模型可以回两个调用，每个包含函数名、参数 JSON 文本和调用 ID。程序解析参数、按顺序执行并回填两个结果。模型收到新历史后回答，CLI 显示文本。\u003c/p>\n\u003ch3 id=\"014-状态到底放在哪里\">01.4 状态到底放在哪里\u003c/h3>\n\u003cp>\u003ccode>agent.messages\u003c/code> 是单个会话的列表。\u003ccode>agent.tools\u003c/code> 是可调用函数表，\u003ccode>agent.schemas\u003c/code> 是发给模型的说明列表。编程工具的闭包保存工作区，日志记录事件。退出进程后，已写的文件和日志还能查，消息历史随实例消失。\u003c/p>\n\u003ch3 id=\"015-这套抽象怎么评价\">01.5 这套抽象怎么评价\u003c/h3>\n\u003cp>新增一个同类型本地工具，可以用 \u003ccode>@tool\u003c/code> 生成说明，再把函数传给 Agent。更换模型传输则可以换 \u003ccode>complete\u003c/code>。面试时把这两个变化举成例子，再说明当前只处理同步、串行工具，单实例面向一个交互会话。\u003c/p>\n"},{"number":2,"id":"m02","title":"读源码必需的 Python 基础","goal":"把列表、字典、函数、装饰器和异常读成实际执行步骤。","questions":[{"id":"m02-a01","module":2,"level":"A","number":1,"question":"messages 中列表与字典分别表示什么？","answer":"列表保留消息的先后顺序。字典描述一条消息的 role、content 等字段。","followup":"","heading":"M02-A01 基础识别","anchor":"m02-a01-基础识别","answerHtml":"\u003cp>列表保留消息的先后顺序。字典描述一条消息的 role、content 等字段。\u003c/p>\n","followupHtml":""},{"id":"m02-a02","module":2,"level":"A","number":2,"question":"f 和 f() 有什么区别？","answer":"f 是函数对象，可以作为参数传入。f() 当场执行，并产生结果或异常。","followup":"","heading":"M02-A02 基础识别","anchor":"m02-a02-基础识别","answerHtml":"\u003cp>f 是函数对象，可以作为参数传入。f() 当场执行，并产生结果或异常。\u003c/p>\n","followupHtml":""},{"id":"m02-a03","module":2,"level":"A","number":3,"question":"调用处 **args 与定义处 **fields 方向相同吗？","answer":"调用处展开一个字典成关键字参数；定义处把收到的关键字参数收集成一个字典。","followup":"","heading":"M02-A03 基础识别","anchor":"m02-a03-基础识别","answerHtml":"\u003cp>调用处展开一个字典成关键字参数；定义处把收到的关键字参数收集成一个字典。\u003c/p>\n","followupHtml":""},{"id":"m02-a04","module":2,"level":"A","number":4,"question":"文件读到的 bytes 怎样变成 str？","answer":"用相应编码解码。相反，写文件前可把字符串用 UTF-8 编码成字节。","followup":"","heading":"M02-A04 基础识别","anchor":"m02-a04-基础识别","answerHtml":"\u003cp>用相应编码解码。相反，写文件前可把字符串用 UTF-8 编码成字节。\u003c/p>\n","followupHtml":""},{"id":"m02-b01","module":2,"level":"B","number":1,"question":"json.loads('[]') 返回什么，能直接 ** 展开吗？","answer":"得到列表。关键字展开需要映射，因此框架先检查参数是字典。","followup":"","heading":"M02-B01 代码推演","anchor":"m02-b01-代码推演","answerHtml":"\u003cp>得到列表。关键字展开需要映射，因此框架先检查参数是字典。\u003c/p>\n","followupHtml":""},{"id":"m02-b02","module":2,"level":"B","number":2,"question":"空字符串 text 与「无输出」做 or 会怎样？","answer":"空字符串为假，表达式返回后面的默认字符串。","followup":"","heading":"M02-B02 代码推演","anchor":"m02-b02-代码推演","answerHtml":"\u003cp>空字符串为假，表达式返回后面的默认字符串。\u003c/p>\n","followupHtml":""},{"id":"m02-b03","module":2,"level":"B","number":3,"question":"range(1, 4) 和 lines[:2] 包含哪些项？","answer":"range 产生 1、2、3。切片取下标 0、1 的元素，短于两项时取已有元素。","followup":"","heading":"M02-B03 代码推演","anchor":"m02-b03-代码推演","answerHtml":"\u003cp>range 产生 1、2、3。切片取下标 0、1 的元素，短于两项时取已有元素。\u003c/p>\n","followupHtml":""},{"id":"m02-b04","module":2,"level":"B","number":4,"question":"为什么 ScriptedModel 保存请求时需要 deepcopy？","answer":"请求里的 messages 是会变化的列表。拷贝把当时的内容和嵌套对象独立保存。","followup":"","heading":"M02-B04 代码推演","anchor":"m02-b04-代码推演","answerHtml":"\u003cp>请求里的 messages 是会变化的列表。拷贝把当时的内容和嵌套对象独立保存。\u003c/p>\n","followupHtml":""},{"id":"m02-c01","module":2,"level":"C","number":1,"question":"类型注解自动阻止错误类型吗？","answer":"Python 普通函数调用不会按注解自动检查。装饰器生成说明，执行入口负责实际检查。","followup":"","heading":"M02-C01 面试追问","anchor":"m02-c01-面试追问","answerHtml":"\u003cp>Python 普通函数调用不会按注解自动检查。装饰器生成说明，执行入口负责实际检查。\u003c/p>\n","followupHtml":""},{"id":"m02-c02","module":2,"level":"C","number":2,"question":"只用 class 就一定不会共享状态吗？","answer":"类属性、引用同一个可变对象或共享外部目录都能造成共享；这里实例历史在构造时新建。","followup":"","heading":"M02-C02 面试追问","anchor":"m02-c02-面试追问","answerHtml":"\u003cp>类属性、引用同一个可变对象或共享外部目录都能造成共享；这里实例历史在构造时新建。\u003c/p>\n","followupHtml":""},{"id":"m02-c03","module":2,"level":"C","number":3,"question":"为什么调用 write() 再传给断言接不住异常？","answer":"参数先求值，异常在断言收到参数前就发生。把可能失败的调用放进 assertRaises 上下文。","followup":"","heading":"M02-C03 面试追问","anchor":"m02-c03-面试追问","answerHtml":"\u003cp>参数先求值，异常在断言收到参数前就发生。把可能失败的调用放进 assertRaises 上下文。\u003c/p>\n","followupHtml":""},{"id":"m02-c04","module":2,"level":"C","number":4,"question":"装饰器返回原函数与包装函数有何差别？","answer":"返回原函数保留对象和调用方式；包装函数可增加调用行为，但需处理签名与元数据。","followup":"","heading":"M02-C04 面试追问","anchor":"m02-c04-面试追问","answerHtml":"\u003cp>返回原函数保留对象和调用方式；包装函数可增加调用行为，但需处理签名与元数据。\u003c/p>\n","followupHtml":""}],"sections":[{"title":"02.1 变量、列表、字典和真假值","id":"021-变量列表字典和真假值","search":"02.1 变量、列表、字典和真假值 变量是对象的名字，不是对象本身。`messages = []` 创建列表并把名字指向它；`messages.append(x)` 改列表内容。字典按键找值，列表按位置取元素：\n\n```python\n# 教学示例\nmessages = [{'role': 'user', 'content': '你好'}]\nfirst = messages[0]\nrole = first['role']\n```\n\n`messages[0]` 得到第一个字典；`first['role']` 得到字符串 user。下标从 0 开始；`[-1]` 是最后一个。空列表、空字符串、None、0 在 if 中都被当作假，非空列表通常为真。因此 `if msg.tool_calls:` 表示“存在待处理调用”，不是检查它是否等于 True。\n\n`a or b` 返回第一个真值对象，否则返回 b，不一定返回布尔值。`out or '(无输出)'` 是在两段文本间选择；`err or out` 并没有把两段输出合并。"},{"title":"02.2 函数对象与函数调用","id":"022-函数对象与函数调用","search":"02.2 函数对象与函数调用 ```python\n# 教学示例\naction = get_time        # 取得函数对象，不执行\nresult = get_time()      # 立刻调用，取得结果\nlater = lambda: get_time()  # 制作一个以后可调用的动作\n```\n\n重试包装器需要反复执行同一动作，所以接收函数对象。若先写 `flaky()`，它可能在重试器接管之前就失败。lambda 是小型匿名函数，不是异步、不自动延迟到后台；只有调用它时才执行函数体。"},{"title":"02.3 位置参数与关键字展开","id":"023-位置参数与关键字展开","search":"02.3 位置参数与关键字展开 ```python\n# 教学示例\nargs = {'path': 'a.txt', 'content': 'hello'}\nwrite_file(**args)\n# 等同于 write_file(path='a.txt', content='hello')\n```\n\n调用处 `**args` 把映射展开成按参数名传入的值；`write_file(args)` 则只传了一个位置参数，通常缺少 content。`get_weather(args)` 不缺参数，却把整个字典当成 city，当前查表时会遇到不可哈希字典错误。\n\n函数定义处 `def log_event(event, **fields)` 做相反的事：把额外关键字参数收集进 fields 字典。类型注解 `path: str` 是元信息，不会自动阻止你传整数。"},{"title":"02.4 类、实例与 self","id":"024-类实例与-self","search":"02.4 类、实例与 self `Agent` 是定义对象行为的类；`agent = Agent(...)` 创建一个实例；`agent.run('你好')` 可以理解成 `Agent.run(agent, '你好')`，实例被放进 self 参数。\n\n构造函数中的 `messages = []` 只是局部名字；`self.messages = []` 设置实例属性，后续方法可以访问。属性不是永久存储，进程退出后内存不会自动留在磁盘。\n\n对名字赋值与修改对象内容是两种操作。`self.requests = []` 把实例属性指向一个新列表；`self.requests.append(...)` 修改这个列表的内容。"},{"title":"02.5 装饰器、属性与签名","id":"025-装饰器属性与签名","search":"02.5 装饰器、属性与签名 ```python\n# 教学示例\n@tool\ndef hello(name: str):\n    return '你好，' + name\n```\n\n它的注册效果等价于函数定义后执行 `hello = tool(hello)`。装饰器可以返回原函数，也可以返回包装函数；本项目给原函数挂 `_schema` 后原样返回，因此直接调用工具仍是普通函数调用。\n\n函数也是对象，所以能有 `hello.__name__`、`hello.__doc__`、自定义的 `hello._schema`。`inspect.signature` 读取参数名、注解和默认值，不能代替实际调用验证。\n\n[源码 · agent.py · tool](../MiniAgent/core/agent.py#L23)"},{"title":"02.6 JSON、字典、字符串与字节","id":"026-json字典字符串与字节","search":"02.6 JSON、字典、字符串与字节 ```python\n# 教学示例\nimport json\ntext = '{\"city\": \"杭州\"}'\nobj = json.loads(text)\nencoded = json.dumps(obj, ensure_ascii=False)\nraw = '你好'.encode('utf-8')\ndecoded = raw.decode('utf-8')\n```\n\ntext 与 encoded 是 str，obj 是 dict，raw 是 bytes。loads/dumps 面向字符串，load/dump 面向文件对象。JSON 不只有对象，还允许数组、数字等，因此解析成功不代表参数一定是字典。\n\n`len('你好')` 是 2 个字符，UTF-8 编码后通常是 6 个字节。这解释了写文件统计字节时为何要先 encode。"},{"title":"02.7 读循环、推导式与异常","id":"027-读循环推导式与异常","search":"02.7 读循环、推导式与异常 `range(1, 121)` 产生 1 到 120。`lines[:200]` 取开头最多 200 项，不包含索引 200；不足 200 项也不会补齐。`''.join(parts)` 把字符串片段拼起来；字符串本来带换行才会形成多行。\n\n```python\n# 教学拆解\nselected = []\nfor line in result.splitlines():\n    if line.startswith('第 '):\n        selected.append(line)\n# 原紧凑写法：[line for line in result.splitlines() if line.startswith('第 ')]\n```\n\nreturn 结束函数，continue 进入当前循环下一轮，raise 把异常交给外层。try 只保护它缩进范围内的语句；函数调用的参数会先求值。要验证函数会抛异常，应把可能失败的调用放入 `with self.assertRaises(...)`。"}],"heading":"02 读源码必需的 Python 基础","slug":"02-读源码必需的-python-基础","line":253,"html":"\u003ch3 id=\"021-变量列表字典和真假值\">02.1 变量、列表、字典和真假值\u003c/h3>\n\u003cp>变量是对象的名字，不是对象本身。\u003ccode>messages = []\u003c/code> 创建列表并把名字指向它；\u003ccode>messages.append(x)\u003c/code> 改列表内容。字典按键找值，列表按位置取元素：\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\"># 教学示例\nmessages = [{&#39;role&#39;: &#39;user&#39;, &#39;content&#39;: &#39;你好&#39;}]\nfirst = messages[0]\nrole = first[&#39;role&#39;]\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>messages[0]\u003c/code> 得到第一个字典；\u003ccode>first[&#39;role&#39;]\u003c/code> 得到字符串 user。下标从 0 开始；\u003ccode>[-1]\u003c/code> 是最后一个。空列表、空字符串、None、0 在 if 中都被当作假，非空列表通常为真。因此 \u003ccode>if msg.tool_calls:\u003c/code> 表示“存在待处理调用”，不是检查它是否等于 True。\u003c/p>\n\u003cp>\u003ccode>a or b\u003c/code> 返回第一个真值对象，否则返回 b，不一定返回布尔值。\u003ccode>out or &#39;(无输出)&#39;\u003c/code> 是在两段文本间选择；\u003ccode>err or out\u003c/code> 并没有把两段输出合并。\u003c/p>\n\u003ch3 id=\"022-函数对象与函数调用\">02.2 函数对象与函数调用\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\"># 教学示例\naction = get_time        # 取得函数对象，不执行\nresult = get_time()      # 立刻调用，取得结果\nlater = lambda: get_time()  # 制作一个以后可调用的动作\n\u003c/code>\u003c/pre>\n\u003cp>重试包装器需要反复执行同一动作，所以接收函数对象。若先写 \u003ccode>flaky()\u003c/code>，它可能在重试器接管之前就失败。lambda 是小型匿名函数，不是异步、不自动延迟到后台；只有调用它时才执行函数体。\u003c/p>\n\u003ch3 id=\"023-位置参数与关键字展开\">02.3 位置参数与关键字展开\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\"># 教学示例\nargs = {&#39;path&#39;: &#39;a.txt&#39;, &#39;content&#39;: &#39;hello&#39;}\nwrite_file(**args)\n# 等同于 write_file(path=&#39;a.txt&#39;, content=&#39;hello&#39;)\n\u003c/code>\u003c/pre>\n\u003cp>调用处 \u003ccode>**args\u003c/code> 把映射展开成按参数名传入的值；\u003ccode>write_file(args)\u003c/code> 则只传了一个位置参数，通常缺少 content。\u003ccode>get_weather(args)\u003c/code> 不缺参数，却把整个字典当成 city，当前查表时会遇到不可哈希字典错误。\u003c/p>\n\u003cp>函数定义处 \u003ccode>def log_event(event, **fields)\u003c/code> 做相反的事：把额外关键字参数收集进 fields 字典。类型注解 \u003ccode>path: str\u003c/code> 是元信息，不会自动阻止你传整数。\u003c/p>\n\u003ch3 id=\"024-类实例与-self\">02.4 类、实例与 self\u003c/h3>\n\u003cp>\u003ccode>Agent\u003c/code> 是定义对象行为的类；\u003ccode>agent = Agent(...)\u003c/code> 创建一个实例；\u003ccode>agent.run(&#39;你好&#39;)\u003c/code> 可以理解成 \u003ccode>Agent.run(agent, &#39;你好&#39;)\u003c/code>，实例被放进 self 参数。\u003c/p>\n\u003cp>构造函数中的 \u003ccode>messages = []\u003c/code> 只是局部名字；\u003ccode>self.messages = []\u003c/code> 设置实例属性，后续方法可以访问。属性不是永久存储，进程退出后内存不会自动留在磁盘。\u003c/p>\n\u003cp>对名字赋值与修改对象内容是两种操作。\u003ccode>self.requests = []\u003c/code> 把实例属性指向一个新列表；\u003ccode>self.requests.append(...)\u003c/code> 修改这个列表的内容。\u003c/p>\n\u003ch3 id=\"025-装饰器属性与签名\">02.5 装饰器、属性与签名\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\"># 教学示例\n@tool\ndef hello(name: str):\n    return &#39;你好，&#39; + name\n\u003c/code>\u003c/pre>\n\u003cp>它的注册效果等价于函数定义后执行 \u003ccode>hello = tool(hello)\u003c/code>。装饰器可以返回原函数，也可以返回包装函数；本项目给原函数挂 \u003ccode>_schema\u003c/code> 后原样返回，因此直接调用工具仍是普通函数调用。\u003c/p>\n\u003cp>函数也是对象，所以能有 \u003ccode>hello.__name__\u003c/code>、\u003ccode>hello.__doc__\u003c/code>、自定义的 \u003ccode>hello._schema\u003c/code>。\u003ccode>inspect.signature\u003c/code> 读取参数名、注解和默认值，不能代替实际调用验证。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/core/agent.py#L23\">源码 · agent.py · tool\u003c/a>\u003c/p>\n\u003ch3 id=\"026-json字典字符串与字节\">02.6 JSON、字典、字符串与字节\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\"># 教学示例\nimport json\ntext = &#39;{&quot;city&quot;: &quot;杭州&quot;}&#39;\nobj = json.loads(text)\nencoded = json.dumps(obj, ensure_ascii=False)\nraw = &#39;你好&#39;.encode(&#39;utf-8&#39;)\ndecoded = raw.decode(&#39;utf-8&#39;)\n\u003c/code>\u003c/pre>\n\u003cp>text 与 encoded 是 str，obj 是 dict，raw 是 bytes。loads/dumps 面向字符串，load/dump 面向文件对象。JSON 不只有对象，还允许数组、数字等，因此解析成功不代表参数一定是字典。\u003c/p>\n\u003cp>\u003ccode>len(&#39;你好&#39;)\u003c/code> 是 2 个字符，UTF-8 编码后通常是 6 个字节。这解释了写文件统计字节时为何要先 encode。\u003c/p>\n\u003ch3 id=\"027-读循环推导式与异常\">02.7 读循环、推导式与异常\u003c/h3>\n\u003cp>\u003ccode>range(1, 121)\u003c/code> 产生 1 到 120。\u003ccode>lines[:200]\u003c/code> 取开头最多 200 项，不包含索引 200；不足 200 项也不会补齐。\u003ccode>&#39;&#39;.join(parts)\u003c/code> 把字符串片段拼起来；字符串本来带换行才会形成多行。\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\"># 教学拆解\nselected = []\nfor line in result.splitlines():\n    if line.startswith(&#39;第 &#39;):\n        selected.append(line)\n# 原紧凑写法：[line for line in result.splitlines() if line.startswith(&#39;第 &#39;)]\n\u003c/code>\u003c/pre>\n\u003cp>return 结束函数，continue 进入当前循环下一轮，raise 把异常交给外层。try 只保护它缩进范围内的语句；函数调用的参数会先求值。要验证函数会抛异常，应把可能失败的调用放入 \u003ccode>with self.assertRaises(...)\u003c/code>。\u003c/p>\n"},{"number":3,"id":"m03","title":"入口、导入与客户端生命周期","goal":"说明 CLI 从读取配置到发起模型请求的顺序。","questions":[{"id":"m03-a01","module":3,"level":"A","number":1,"question":"两个入口最大的差别是什么？","answer":"main_coding.py 传 coding=True，因此多了解析工作区与执行开关的参数，并选择编程工具组。","followup":"","heading":"M03-A01 基础识别","anchor":"m03-a01-基础识别","answerHtml":"\u003cp>main_coding.py 传 coding=True，因此多了解析工作区与执行开关的参数，并选择编程工具组。\u003c/p>\n","followupHtml":""},{"id":"m03-a02","module":3,"level":"A","number":2,"question":"入口的 __name__ 判断做什么？","answer":"仅在文件被直接当脚本运行时启动 CLI。导入时它只建立模块和函数。","followup":"","heading":"M03-A02 基础识别","anchor":"m03-a02-基础识别","answerHtml":"\u003cp>仅在文件被直接当脚本运行时启动 CLI。导入时它只建立模块和函数。\u003c/p>\n","followupHtml":""},{"id":"m03-a03","module":3,"level":"A","number":3,"question":"读 .env、创建客户端、发请求怎样区分？","answer":"读配置准备环境值，创建客户端设定连接参数，循环中的 complete 才实际发送请求。","followup":"","heading":"M03-A03 基础识别","anchor":"m03-a03-基础识别","answerHtml":"\u003cp>读配置准备环境值，创建客户端设定连接参数，循环中的 complete 才实际发送请求。\u003c/p>\n","followupHtml":""},{"id":"m03-a04","module":3,"level":"A","number":4,"question":"CLI 使用哪个服务，如何定位？","answer":"OpenAI Python SDK 请求显式配置的 DeepSeek base_url，默认使用 deepseek-flash。","followup":"","heading":"M03-A04 基础识别","anchor":"m03-a04-基础识别","answerHtml":"\u003cp>OpenAI Python SDK 请求显式配置的 DeepSeek base_url，默认使用 deepseek-flash。\u003c/p>\n","followupHtml":""},{"id":"m03-b01","module":3,"level":"B","number":1,"question":"导入 Agent 为什么不需要 API Key？","answer":"核心模块只定义函数和类。读取 Key 与创建客户端发生在 CLI 的 main 中。","followup":"","heading":"M03-B01 代码推演","anchor":"m03-b01-代码推演","answerHtml":"\u003cp>核心模块只定义函数和类。读取 Key 与创建客户端发生在 CLI 的 main 中。\u003c/p>\n","followupHtml":""},{"id":"m03-b02","module":3,"level":"B","number":2,"question":"为什么 --help 能在没有 Key 时工作？","answer":"参数解析先执行，帮助流程会输出后退出，尚未走到读取和验证 Key 的语句。","followup":"","heading":"M03-B02 代码推演","anchor":"m03-b02-代码推演","answerHtml":"\u003cp>参数解析先执行，帮助流程会输出后退出，尚未走到读取和验证 Key 的语句。\u003c/p>\n","followupHtml":""},{"id":"m03-b03","module":3,"level":"B","number":3,"question":"输入 ' q ' 与 'Q' 会发生什么？","answer":"strip 去掉两端空白，所以前者退出。Q 大小写不同，会作为提问处理。","followup":"","heading":"M03-B03 代码推演","anchor":"m03-b03-代码推演","answerHtml":"\u003cp>strip 去掉两端空白，所以前者退出。Q 大小写不同，会作为提问处理。\u003c/p>\n","followupHtml":""},{"id":"m03-b04","module":3,"level":"B","number":4,"question":"q 后客户端何时关闭？","answer":"break 离开交互循环，然后退出 OpenAI 客户端的 with 块，资源被关闭。","followup":"","heading":"M03-B04 代码推演","anchor":"m03-b04-代码推演","answerHtml":"\u003cp>break 离开交互循环，然后退出 OpenAI 客户端的 with 块，资源被关闭。\u003c/p>\n","followupHtml":""},{"id":"m03-c01","module":3,"level":"C","number":1,"question":"如何让自检无需真实 Key？","answer":"给 Agent 注入预设响应函数，或者给实际 SDK 注入 MockTransport。","followup":"","heading":"M03-C01 面试追问","anchor":"m03-c01-面试追问","answerHtml":"\u003cp>给 Agent 注入预设响应函数，或者给实际 SDK 注入 MockTransport。\u003c/p>\n","followupHtml":""},{"id":"m03-c02","module":3,"level":"C","number":2,"question":"为什么 CLI 用 partial？","answer":"先给 SDK 请求绑定 DeepSeek 的非思考模式选项，让 Agent 核心只调用传入的 complete。","followup":"","heading":"M03-C02 面试追问","anchor":"m03-c02-面试追问","answerHtml":"\u003cp>先给 SDK 请求绑定 DeepSeek 的非思考模式选项，让 Agent 核心只调用传入的 complete。\u003c/p>\n","followupHtml":""},{"id":"m03-c03","module":3,"level":"C","number":3,"question":"命令中的 python 与 sys.executable 有何差别？","answer":"python 依赖 shell 查找顺序；sys.executable 是当前解释器的路径。","followup":"","heading":"M03-C03 面试追问","anchor":"m03-c03-面试追问","answerHtml":"\u003cp>python 依赖 shell 查找顺序；sys.executable 是当前解释器的路径。\u003c/p>\n","followupHtml":""},{"id":"m03-c04","module":3,"level":"C","number":4,"question":"系统提示能代替 CLI 参数与真实检查吗？","answer":"提示影响模型选择，工作区限制、工具注册与确认来自程序逻辑。","followup":"","heading":"M03-C04 面试追问","anchor":"m03-c04-面试追问","answerHtml":"\u003cp>提示影响模型选择，工作区限制、工具注册与确认来自程序逻辑。\u003c/p>\n","followupHtml":""}],"sections":[{"title":"03.1 从命令行启动到等待输入","id":"031-从命令行启动到等待输入","search":"03.1 从命令行启动到等待输入 `main.py` 调用 `main()`，`main_coding.py` 调用 `main(coding=True)`。`cli.py` 先解析参数，再读取仓库根目录的 `.env`。接着选工具、创建客户端、构造 Agent，最后进入 `while True`。每条非空输入执行一次 `agent.run(question)`，CLI 负责打印返回文本。\n\n[源码 · cli.py · main](../MiniAgent/cli.py#L43)"},{"title":"03.2 import 会执行哪些事","id":"032-import-会执行哪些事","search":"03.2 import 会执行哪些事 导入模块时，Python 执行模块顶层语句。函数定义会建立函数对象，`@tool` 会在定义时生成 Schema。客户端构造在 `main` 里，导入核心或运行离线测试都不需要 Key。`if __name__ == \"__main__\"` 让入口只在脚本直接运行时启动。"},{"title":"03.3 配置、客户端、请求是三个时刻","id":"033-配置客户端请求是三个时刻","search":"03.3 配置、客户端、请求是三个时刻 1. `load_dotenv(...)` 把配置加载进环境，已有系统变量优先。\n2. `with OpenAI(...) as client` 管理客户端生命周期，设置 DeepSeek 地址、20 秒 SDK 请求超时和 `max_retries=0`。\n3. `partial` 给 `client.chat.completions.create` 预填 DeepSeek 的非思考模式选项。Agent 只得到 `complete`，在循环里传模型名、消息和工具说明。这个入口用基础文本与工具协议。"},{"title":"03.4 路径与运行环境不要混为一谈","id":"034-路径与运行环境不要混为一谈","search":"03.4 路径与运行环境不要混为一谈 仓库根目录用来找 `.env`。编程工具默认操作 `MiniAgent/workspace`。`--workspace .\\my-demo` 里的相对路径从启动 CLI 的当前目录解析。`sys.executable` 则是当前正在运行 CLI 的 Python 路径，脚本工具用它启动同一个解释器。\n\n| 本地看到的名字 | 用途 |\n|---|---|\n| `.env` | 保存本地 API Key 和模型配置的小文本文件 |\n| `.venv/` | Python 虚拟环境，`Scripts/` 有启动用的 `python.exe`，`Lib/` 里有 SDK 等依赖 |\n| `.env.example`、`requirements.txt` | 可以提交的配置模板和依赖清单，换电脑时用它们重建环境 |\n\n当前 Trae 命令用 `\\.venv\\Scripts\\python.exe` 运行。如果虚拟环境被删掉，需要重新创建并安装依赖，原来的命令才能继续使用。Git 忽略 `.env` 和 `.venv/`。"},{"title":"03.5 读完做一次口述","id":"035-读完做一次口述","search":"03.5 读完做一次口述 先运行两个入口的 `--help`。手推输入 `\" q \"` 时为什么会退出，按 Ctrl+C 又在哪里被处理。HTTP 状态错误和空模型响应由 CLI 显示简短提示，可以继续输入。普通 `q` 会退出循环并关闭客户端。"}],"heading":"03 入口、导入与客户端生命周期","slug":"03-入口导入与客户端生命周期","line":490,"html":"\u003ch3 id=\"031-从命令行启动到等待输入\">03.1 从命令行启动到等待输入\u003c/h3>\n\u003cp>\u003ccode>main.py\u003c/code> 调用 \u003ccode>main()\u003c/code>，\u003ccode>main_coding.py\u003c/code> 调用 \u003ccode>main(coding=True)\u003c/code>。\u003ccode>cli.py\u003c/code> 先解析参数，再读取仓库根目录的 \u003ccode>.env\u003c/code>。接着选工具、创建客户端、构造 Agent，最后进入 \u003ccode>while True\u003c/code>。每条非空输入执行一次 \u003ccode>agent.run(question)\u003c/code>，CLI 负责打印返回文本。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/cli.py#L43\">源码 · cli.py · main\u003c/a>\u003c/p>\n\u003ch3 id=\"032-import-会执行哪些事\">03.2 import 会执行哪些事\u003c/h3>\n\u003cp>导入模块时，Python 执行模块顶层语句。函数定义会建立函数对象，\u003ccode>@tool\u003c/code> 会在定义时生成 Schema。客户端构造在 \u003ccode>main\u003c/code> 里，导入核心或运行离线测试都不需要 Key。\u003ccode>if __name__ == &quot;__main__&quot;\u003c/code> 让入口只在脚本直接运行时启动。\u003c/p>\n\u003ch3 id=\"033-配置客户端请求是三个时刻\">03.3 配置、客户端、请求是三个时刻\u003c/h3>\n\u003col>\n\u003cli>\u003ccode>load_dotenv(...)\u003c/code> 把配置加载进环境，已有系统变量优先。\u003c/li>\n\u003cli>\u003ccode>with OpenAI(...) as client\u003c/code> 管理客户端生命周期，设置 DeepSeek 地址、20 秒 SDK 请求超时和 \u003ccode>max_retries=0\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>partial\u003c/code> 给 \u003ccode>client.chat.completions.create\u003c/code> 预填 DeepSeek 的非思考模式选项。Agent 只得到 \u003ccode>complete\u003c/code>，在循环里传模型名、消息和工具说明。这个入口用基础文本与工具协议。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"034-路径与运行环境不要混为一谈\">03.4 路径与运行环境不要混为一谈\u003c/h3>\n\u003cp>仓库根目录用来找 \u003ccode>.env\u003c/code>。编程工具默认操作 \u003ccode>MiniAgent/workspace\u003c/code>。\u003ccode>--workspace .\\my-demo\u003c/code> 里的相对路径从启动 CLI 的当前目录解析。\u003ccode>sys.executable\u003c/code> 则是当前正在运行 CLI 的 Python 路径，脚本工具用它启动同一个解释器。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>本地看到的名字\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>.env\u003c/code>\u003c/td>\n\u003ctd>保存本地 API Key 和模型配置的小文本文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.venv/\u003c/code>\u003c/td>\n\u003ctd>Python 虚拟环境，\u003ccode>Scripts/\u003c/code> 有启动用的 \u003ccode>python.exe\u003c/code>，\u003ccode>Lib/\u003c/code> 里有 SDK 等依赖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.env.example\u003c/code>、\u003ccode>requirements.txt\u003c/code>\u003c/td>\n\u003ctd>可以提交的配置模板和依赖清单，换电脑时用它们重建环境\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>当前 Trae 命令用 \u003ccode>\\.venv\\Scripts\\python.exe\u003c/code> 运行。如果虚拟环境被删掉，需要重新创建并安装依赖，原来的命令才能继续使用。Git 忽略 \u003ccode>.env\u003c/code> 和 \u003ccode>.venv/\u003c/code>。\u003c/p>\n\u003ch3 id=\"035-读完做一次口述\">03.5 读完做一次口述\u003c/h3>\n\u003cp>先运行两个入口的 \u003ccode>--help\u003c/code>。手推输入 \u003ccode>&quot; q &quot;\u003c/code> 时为什么会退出，按 Ctrl+C 又在哪里被处理。HTTP 状态错误和空模型响应由 CLI 显示简短提示，可以继续输入。普通 \u003ccode>q\u003c/code> 会退出循环并关闭客户端。\u003c/p>\n"},{"number":4,"id":"m04","title":"工具注册与 JSON Schema","goal":"由 Python 函数签名推导 Schema，再预测执行校验。","questions":[{"id":"m04-a01","module":4,"level":"A","number":1,"question":"tool 装饰器的主要步骤是什么？","answer":"读取签名和注解，整理类型与必填项，写入 _schema，返回原函数。","followup":"","heading":"M04-A01 基础识别","anchor":"m04-a01-基础识别","answerHtml":"\u003cp>读取签名和注解，整理类型与必填项，写入 _schema，返回原函数。\u003c/p>\n","followupHtml":""},{"id":"m04-a02","module":4,"level":"A","number":2,"question":"properties 和 required 各表示什么？","answer":"properties 描述允许的键及类型；required 列出必须给出的键。","followup":"","heading":"M04-A02 基础识别","anchor":"m04-a02-基础识别","answerHtml":"\u003cp>properties 描述允许的键及类型；required 列出必须给出的键。\u003c/p>\n","followupHtml":""},{"id":"m04-a03","module":4,"level":"A","number":3,"question":"函数没有文档字符串时会怎样？","answer":"description 是空字符串，注册仍可完成。","followup":"","heading":"M04-A03 基础识别","anchor":"m04-a03-基础识别","answerHtml":"\u003cp>description 是空字符串，注册仍可完成。\u003c/p>\n","followupHtml":""},{"id":"m04-a04","module":4,"level":"A","number":4,"question":"str、int、float、bool 对应哪些 Schema 类型？","answer":"依次是 string、integer、number、boolean。","followup":"","heading":"M04-A04 基础识别","anchor":"m04-a04-基础识别","answerHtml":"\u003cp>依次是 string、integer、number、boolean。\u003c/p>\n","followupHtml":""},{"id":"m04-b01","module":4,"level":"B","number":1,"question":"repeat(text: str, times: int=1) 必填哪些？","answer":"只必填 text。省略 times 时由 Python 使用 1。","followup":"","heading":"M04-B01 代码推演","anchor":"m04-b01-代码推演","answerHtml":"\u003cp>只必填 text。省略 times 时由 Python 使用 1。\u003c/p>\n","followupHtml":""},{"id":"m04-b02","module":4,"level":"B","number":2,"question":"参数 value: str = None 时，省略与传 null 一样吗？","answer":"省略使用默认值 None；显式 null 解码为 None，会因类型不符合 string 被拒绝。","followup":"","heading":"M04-B02 代码推演","anchor":"m04-b02-代码推演","answerHtml":"\u003cp>省略使用默认值 None；显式 null 解码为 None，会因类型不符合 string 被拒绝。\u003c/p>\n","followupHtml":""},{"id":"m04-b03","module":4,"level":"B","number":3,"question":"直接调用带 @tool 的 read_file 会经过核心校验吗？","answer":"它是普通函数调用，执行工具自身的路径和读写逻辑。execute_tool 的参数校验发生在框架入口。","followup":"","heading":"M04-B03 代码推演","anchor":"m04-b03-代码推演","answerHtml":"\u003cp>它是普通函数调用，执行工具自身的路径和读写逻辑。execute_tool 的参数校验发生在框架入口。\u003c/p>\n","followupHtml":""},{"id":"m04-b04","module":4,"level":"B","number":4,"question":"工具参数写 list[str] 或 *args 会怎样？","answer":"装饰器无法生成当前支持的 Schema，会在装饰阶段报 TypeError。","followup":"","heading":"M04-B04 代码推演","anchor":"m04-b04-代码推演","answerHtml":"\u003cp>装饰器无法生成当前支持的 Schema，会在装饰阶段报 TypeError。\u003c/p>\n","followupHtml":""},{"id":"m04-c01","module":4,"level":"C","number":1,"question":"Schema 正确还需要执行时检查吗？","answer":"需要。模型输出是外部输入，仍可能漏字段、给错类型或返回坏 JSON。","followup":"","heading":"M04-C01 面试追问","anchor":"m04-c01-面试追问","answerHtml":"\u003cp>需要。模型输出是外部输入，仍可能漏字段、给错类型或返回坏 JSON。\u003c/p>\n","followupHtml":""},{"id":"m04-c02","module":4,"level":"C","number":2,"question":"同名工具为什么在 Agent 构造时检查？","answer":"只有装配同一实例时，才知道两个函数会争抢同一个名字。","followup":"","heading":"M04-C02 面试追问","anchor":"m04-c02-面试追问","answerHtml":"\u003cp>只有装配同一实例时，才知道两个函数会争抢同一个名字。\u003c/p>\n","followupHtml":""},{"id":"m04-c03","module":4,"level":"C","number":3,"question":"为什么用 type(value) is int？","answer":"Python 的 bool 是 int 的子类。精确检查避免把 JSON true 当作整数。","followup":"","heading":"M04-C03 面试追问","anchor":"m04-c03-面试追问","answerHtml":"\u003cp>Python 的 bool 是 int 的子类。精确检查避免把 JSON true 当作整数。\u003c/p>\n","followupHtml":""},{"id":"m04-c04","module":4,"level":"C","number":4,"question":"以后要支持 MCP 的复杂参数，如何演进？","answer":"先引入能描述函数名、Schema、调用方式的工具表示，再选用能处理对象、数组的 Schema 校验，并保留现有回归。","followup":"本地函数和远端工具的授权是否应该走同一入口？","heading":"M04-C04 面试追问","anchor":"m04-c04-面试追问","answerHtml":"\u003cp>先引入能描述函数名、Schema、调用方式的工具表示，再选用能处理对象、数组的 Schema 校验，并保留现有回归。\u003c/p>\n","followupHtml":"\u003cp>本地函数和远端工具的授权是否应该走同一入口？\u003c/p>\n"}],"sections":[{"title":"04.1 工具说明与可执行函数分开","id":"041-工具说明与可执行函数分开","search":"04.1 工具说明与可执行函数分开 `Agent.tools[\"read_file\"]` 是 Python 函数。`Agent.schemas` 里的描述可以编码成 JSON 发给模型。用手册类比，Schema 是菜单，函数是厨师，模型发回的是点单。"},{"title":"04.2 按数据变化读装饰器","id":"042-按数据变化读装饰器","search":"04.2 按数据变化读装饰器 `@tool` 读取签名和类型注解，遍历参数，把 `str/int/float/bool` 转为 `string/integer/number/boolean`。没有默认值的参数进入 `required`。函数名、文档字符串与参数描述一起存到 `func._schema`，装饰器最后返回原函数。可以在 [agent.py](../MiniAgent/core/agent.py) 顺着 `tool → _matches_type → execute_tool` 对照。\n\n[源码 · agent.py · tool](../MiniAgent/core/agent.py#L23)"},{"title":"04.3 从一个有默认参数的例子推导","id":"043-从一个有默认参数的例子推导","search":"04.3 从一个有默认参数的例子推导 ```python\ndef write_file(path: str, content: str, overwrite: bool = False):\n    ...\n```\n\n`properties` 有三个键。`required` 只有 `path` 和 `content`，因为 `overwrite` 已有默认值。模型只传前两个参数时，`func(**args)` 让 Python 使用 `False`。如果传了 `\"overwrite\": \"true\"`，字符串会在执行前被拒绝。"},{"title":"04.4 empty 与 None 分别表示什么","id":"044-empty-与-none-分别表示什么","search":"04.4 empty 与 None 分别表示什么 `inspect.Parameter.empty` 表示没有给默认值。`None` 可以作为 Python 默认值。当前 Schema 类型不含 JSON null，所以对 `value: str = None` 来说，省略参数与显式传 `null` 结果不同。项目内置工具使用和注解一致的默认值。"},{"title":"04.5 当前支持范围与执行校验","id":"045-当前支持范围与执行校验","search":"04.5 当前支持范围与执行校验 装饰阶段拒绝未支持的注解、位置专用参数和可变长参数。执行阶段才检查模型传回的 JSON、对象结构、必填键、额外键和实际类型。`bool` 在 Python 是 `int` 的子类，运行时使用精确类型判断防止 `true` 混进整数参数。`number` 接收整数或有限浮点数。\n\n解析 JSON 时，`object_pairs_hook` 会收到键值对列表。`_unique_json_object` 逐个检查键是否已经出现。这样 `{\"overwrite\":false,\"overwrite\":true}` 会被拒绝，避免默认解析悄悄采用后一个值。\n\n[源码 · agent.py · execute_tool](../MiniAgent/core/agent.py#L153)"}],"heading":"04 工具注册与 JSON Schema","slug":"04-工具注册与-json-schema","line":666,"html":"\u003ch3 id=\"041-工具说明与可执行函数分开\">04.1 工具说明与可执行函数分开\u003c/h3>\n\u003cp>\u003ccode>Agent.tools[&quot;read_file&quot;]\u003c/code> 是 Python 函数。\u003ccode>Agent.schemas\u003c/code> 里的描述可以编码成 JSON 发给模型。用手册类比，Schema 是菜单，函数是厨师，模型发回的是点单。\u003c/p>\n\u003ch3 id=\"042-按数据变化读装饰器\">04.2 按数据变化读装饰器\u003c/h3>\n\u003cp>\u003ccode>@tool\u003c/code> 读取签名和类型注解，遍历参数，把 \u003ccode>str/int/float/bool\u003c/code> 转为 \u003ccode>string/integer/number/boolean\u003c/code>。没有默认值的参数进入 \u003ccode>required\u003c/code>。函数名、文档字符串与参数描述一起存到 \u003ccode>func._schema\u003c/code>，装饰器最后返回原函数。可以在 \u003ca href=\"../MiniAgent/core/agent.py\">agent.py\u003c/a> 顺着 \u003ccode>tool → _matches_type → execute_tool\u003c/code> 对照。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/core/agent.py#L23\">源码 · agent.py · tool\u003c/a>\u003c/p>\n\u003ch3 id=\"043-从一个有默认参数的例子推导\">04.3 从一个有默认参数的例子推导\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\">def write_file(path: str, content: str, overwrite: bool = False):\n    ...\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>properties\u003c/code> 有三个键。\u003ccode>required\u003c/code> 只有 \u003ccode>path\u003c/code> 和 \u003ccode>content\u003c/code>，因为 \u003ccode>overwrite\u003c/code> 已有默认值。模型只传前两个参数时，\u003ccode>func(**args)\u003c/code> 让 Python 使用 \u003ccode>False\u003c/code>。如果传了 \u003ccode>&quot;overwrite&quot;: &quot;true&quot;\u003c/code>，字符串会在执行前被拒绝。\u003c/p>\n\u003ch3 id=\"044-empty-与-none-分别表示什么\">04.4 empty 与 None 分别表示什么\u003c/h3>\n\u003cp>\u003ccode>inspect.Parameter.empty\u003c/code> 表示没有给默认值。\u003ccode>None\u003c/code> 可以作为 Python 默认值。当前 Schema 类型不含 JSON null，所以对 \u003ccode>value: str = None\u003c/code> 来说，省略参数与显式传 \u003ccode>null\u003c/code> 结果不同。项目内置工具使用和注解一致的默认值。\u003c/p>\n\u003ch3 id=\"045-当前支持范围与执行校验\">04.5 当前支持范围与执行校验\u003c/h3>\n\u003cp>装饰阶段拒绝未支持的注解、位置专用参数和可变长参数。执行阶段才检查模型传回的 JSON、对象结构、必填键、额外键和实际类型。\u003ccode>bool\u003c/code> 在 Python 是 \u003ccode>int\u003c/code> 的子类，运行时使用精确类型判断防止 \u003ccode>true\u003c/code> 混进整数参数。\u003ccode>number\u003c/code> 接收整数或有限浮点数。\u003c/p>\n\u003cp>解析 JSON 时，\u003ccode>object_pairs_hook\u003c/code> 会收到键值对列表。\u003ccode>_unique_json_object\u003c/code> 逐个检查键是否已经出现。这样 \u003ccode>{&quot;overwrite&quot;:false,&quot;overwrite&quot;:true}\u003c/code> 会被拒绝，避免默认解析悄悄采用后一个值。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/core/agent.py#L153\">源码 · agent.py · execute_tool\u003c/a>\u003c/p>\n"},{"number":5,"id":"m05","title":"Agent 构造与状态隔离","goal":"分清 Agent 自己的状态、共享引用和文件工作区。","questions":[{"id":"m05-a01","module":5,"level":"A","number":1,"question":"构造函数装配了什么？","answer":"角色消息、工具函数表、Schema 列表、请求函数、模型名和轮数预算。","followup":"","heading":"M05-A01 基础识别","anchor":"m05-a01-基础识别","answerHtml":"\u003cp>角色消息、工具函数表、Schema 列表、请求函数、模型名和轮数预算。\u003c/p>\n","followupHtml":""},{"id":"m05-a02","module":5,"level":"A","number":2,"question":"tools 字典为什么不直接发给模型？","answer":"字典里存真实 Python 函数；模型请求应携带可序列化的说明。","followup":"","heading":"M05-A02 基础识别","anchor":"m05-a02-基础识别","answerHtml":"\u003cp>字典里存真实 Python 函数；模型请求应携带可序列化的说明。\u003c/p>\n","followupHtml":""},{"id":"m05-a03","module":5,"level":"A","number":3,"question":"messages 初始值是什么？","answer":"一个只含 system 消息的列表，正文是应用提供的角色提示。","followup":"","heading":"M05-A03 基础识别","anchor":"m05-a03-基础识别","answerHtml":"\u003cp>一个只含 system 消息的列表，正文是应用提供的角色提示。\u003c/p>\n","followupHtml":""},{"id":"m05-a04","module":5,"level":"A","number":4,"question":"轮数上限默认是多少，要求什么类型？","answer":"默认 5，要求正整数，布尔值也会被拒绝。","followup":"","heading":"M05-A04 基础识别","anchor":"m05-a04-基础识别","answerHtml":"\u003cp>默认 5，要求正整数，布尔值也会被拒绝。\u003c/p>\n","followupHtml":""},{"id":"m05-b01","module":5,"level":"B","number":1,"question":"a、b 两个实例，只有 a 收到一轮消息，b 的历史怎样？","answer":"b 仍只有自己的 system 消息。","followup":"","heading":"M05-B01 代码推演","anchor":"m05-b01-代码推演","answerHtml":"\u003cp>b 仍只有自己的 system 消息。\u003c/p>\n","followupHtml":""},{"id":"m05-b02","module":5,"level":"B","number":2,"question":"同一个实例连续 run 会怎样？","answer":"它会继续向自己的 messages 追加上下文，因此后续请求可看到前面的会话。","followup":"","heading":"M05-B02 代码推演","anchor":"m05-b02-代码推演","answerHtml":"\u003cp>它会继续向自己的 messages 追加上下文，因此后续请求可看到前面的会话。\u003c/p>\n","followupHtml":""},{"id":"m05-b03","module":5,"level":"B","number":3,"question":"注册一个没加 @tool 的函数会怎样？","answer":"构造时因为没有 _schema 抛 TypeError。","followup":"","heading":"M05-B03 代码推演","anchor":"m05-b03-代码推演","answerHtml":"\u003cp>构造时因为没有 _schema 抛 TypeError。\u003c/p>\n","followupHtml":""},{"id":"m05-b04","module":5,"level":"B","number":4,"question":"传两个同名工具会怎样？","answer":"构造时抛 ValueError，避免执行表和工具说明产生歧义。","followup":"","heading":"M05-B04 代码推演","anchor":"m05-b04-代码推演","answerHtml":"\u003cp>构造时抛 ValueError，避免执行表和工具说明产生歧义。\u003c/p>\n","followupHtml":""},{"id":"m05-c01","module":5,"level":"C","number":1,"question":"schemas 列表独立，列表里的字典也独立吗？","answer":"同一个函数的 _schema 可被多个实例引用。两个列表独立，所引用的 Schema 字典仍可能共享。","followup":"","heading":"M05-C01 面试追问","anchor":"m05-c01-面试追问","answerHtml":"\u003cp>同一个函数的 _schema 可被多个实例引用。两个列表独立，所引用的 Schema 字典仍可能共享。\u003c/p>\n","followupHtml":""},{"id":"m05-c02","module":5,"level":"C","number":2,"question":"同一个实例并发处理多个用户输入会怎样？","answer":"历史可交错，工具调用和结果顺序无法保证。当前 CLI 按一个会话串行使用。","followup":"","heading":"M05-C02 面试追问","anchor":"m05-c02-面试追问","answerHtml":"\u003cp>历史可交错，工具调用和结果顺序无法保证。当前 CLI 按一个会话串行使用。\u003c/p>\n","followupHtml":""},{"id":"m05-c03","module":5,"level":"C","number":3,"question":"工具实例和工作区隔离有什么关系？","answer":"每次 build_tools 产生一组捕获根目录的闭包；要隔离磁盘数据，应为会话选不同工作区。","followup":"","heading":"M05-C03 面试追问","anchor":"m05-c03-面试追问","answerHtml":"\u003cp>每次 build_tools 产生一组捕获根目录的闭包；要隔离磁盘数据，应为会话选不同工作区。\u003c/p>\n","followupHtml":""},{"id":"m05-c04","module":5,"level":"C","number":4,"question":"max_turns 能限制全部工具和网络尝试数吗？","answer":"它限制逻辑模型轮数；一个响应可以带多个工具，网络错误还可能触发重试。","followup":"","heading":"M05-C04 面试追问","anchor":"m05-c04-面试追问","answerHtml":"\u003cp>它限制逻辑模型轮数；一个响应可以带多个工具，网络错误还可能触发重试。\u003c/p>\n","followupHtml":""}],"sections":[{"title":"05.1 构造函数装配了什么","id":"051-构造函数装配了什么","search":"05.1 构造函数装配了什么 构造 Agent 时传入工具、角色提示、`complete`、模型名和可选的轮数上限。它记录请求函数与配置，创建独立的 `tools`、`schemas` 和 `messages`。第一条消息是 `system`，内容来自应用层的角色提示。\n\n[源码 · agent.py · __init__](../MiniAgent/core/agent.py#L126)"},{"title":"05.2 工具列表怎样被消费","id":"052-工具列表怎样被消费","search":"05.2 工具列表怎样被消费 构造函数逐一检查工具有无 `_schema` 和重名情况，然后建立 `名字 → 函数` 映射并收集 Schema。重名在装配阶段报错，可以在启动时发现。`max_turns` 要求是正整数，默认 5。"},{"title":"05.3 两个实例为什么不串历史","id":"053-两个实例为什么不串历史","search":"05.3 两个实例为什么不串历史 ```python\na = Agent(tools, \"数学助手\", complete=fake_complete, model=\"fake\")\nb = Agent(tools, \"文件助手\", complete=fake_complete, model=\"fake\")\n```\n\n只调用 `a.run(...)` 时，`b.messages` 仍只有 system。两个实例可以引用同一个工具函数和它的 Schema，因此不要原地修改 Schema。编程应用要隔离文件，用不同目录分别调用 `build_tools`；多个实例指向同一路径时仍会操作同一份文件。"},{"title":"05.4 必填角色与默认预算的取舍","id":"054-必填角色与默认预算的取舍","search":"05.4 必填角色与默认预算的取舍 核心不知道用户要数学还是编程，所以角色由应用提供。`max_turns` 计数的是一次输入内的模型决策轮数。每轮可能有多个调用，也可能有多个网络尝试。一个 Agent 用于一个交互会话，当前没有同一实例并发执行的保护。"}],"heading":"05 Agent 构造与状态隔离","slug":"05-agent-构造与状态隔离","line":843,"html":"\u003ch3 id=\"051-构造函数装配了什么\">05.1 构造函数装配了什么\u003c/h3>\n\u003cp>构造 Agent 时传入工具、角色提示、\u003ccode>complete\u003c/code>、模型名和可选的轮数上限。它记录请求函数与配置，创建独立的 \u003ccode>tools\u003c/code>、\u003ccode>schemas\u003c/code> 和 \u003ccode>messages\u003c/code>。第一条消息是 \u003ccode>system\u003c/code>，内容来自应用层的角色提示。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/core/agent.py#L126\">源码 · agent.py · \u003cstrong>init\u003c/strong>\u003c/a>\u003c/p>\n\u003ch3 id=\"052-工具列表怎样被消费\">05.2 工具列表怎样被消费\u003c/h3>\n\u003cp>构造函数逐一检查工具有无 \u003ccode>_schema\u003c/code> 和重名情况，然后建立 \u003ccode>名字 → 函数\u003c/code> 映射并收集 Schema。重名在装配阶段报错，可以在启动时发现。\u003ccode>max_turns\u003c/code> 要求是正整数，默认 5。\u003c/p>\n\u003ch3 id=\"053-两个实例为什么不串历史\">05.3 两个实例为什么不串历史\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\">a = Agent(tools, &quot;数学助手&quot;, complete=fake_complete, model=&quot;fake&quot;)\nb = Agent(tools, &quot;文件助手&quot;, complete=fake_complete, model=&quot;fake&quot;)\n\u003c/code>\u003c/pre>\n\u003cp>只调用 \u003ccode>a.run(...)\u003c/code> 时，\u003ccode>b.messages\u003c/code> 仍只有 system。两个实例可以引用同一个工具函数和它的 Schema，因此不要原地修改 Schema。编程应用要隔离文件，用不同目录分别调用 \u003ccode>build_tools\u003c/code>；多个实例指向同一路径时仍会操作同一份文件。\u003c/p>\n\u003ch3 id=\"054-必填角色与默认预算的取舍\">05.4 必填角色与默认预算的取舍\u003c/h3>\n\u003cp>核心不知道用户要数学还是编程，所以角色由应用提供。\u003ccode>max_turns\u003c/code> 计数的是一次输入内的模型决策轮数。每轮可能有多个调用，也可能有多个网络尝试。一个 Agent 用于一个交互会话，当前没有同一实例并发执行的保护。\u003c/p>\n"},{"number":6,"id":"m06","title":"主循环与消息协议","goal":"手推一次调用批次，解释工具失败、回填与最终回答。","questions":[{"id":"m06-a01","module":6,"level":"A","number":1,"question":"run 的两个主要分支按什么区分？","answer":"有 tool_calls 时执行工具并继续；有文本且无调用时保存最终回答并返回。都没有会报错。","followup":"","heading":"M06-A01 基础识别","anchor":"m06-a01-基础识别","answerHtml":"\u003cp>有 tool_calls 时执行工具并继续；有文本且无调用时保存最终回答并返回。都没有会报错。\u003c/p>\n","followupHtml":""},{"id":"m06-a02","module":6,"level":"A","number":2,"question":"为什么先追加 user 再发请求？","answer":"模型从当前 messages 读取本次问题和历史上下文。","followup":"","heading":"M06-A02 基础识别","anchor":"m06-a02-基础识别","answerHtml":"\u003cp>模型从当前 messages 读取本次问题和历史上下文。\u003c/p>\n","followupHtml":""},{"id":"m06-a03","module":6,"level":"A","number":3,"question":"tool_call_id 有什么用途？","answer":"把每条 tool 结果与发起调用的 ID 对上，同轮多个同名调用也可区分。","followup":"","heading":"M06-A03 基础识别","anchor":"m06-a03-基础识别","answerHtml":"\u003cp>把每条 tool 结果与发起调用的 ID 对上，同轮多个同名调用也可区分。\u003c/p>\n","followupHtml":""},{"id":"m06-a04","module":6,"level":"A","number":4,"question":"工具分支的 continue 和 return 有何差别？","answer":"continue 让模型再看包含工具结果的历史；return 会结束本次用户回合。","followup":"","heading":"M06-A04 基础识别","anchor":"m06-a04-基础识别","answerHtml":"\u003cp>continue 让模型再看包含工具结果的历史；return 会结束本次用户回合。\u003c/p>\n","followupHtml":""},{"id":"m06-b01","module":6,"level":"B","number":1,"question":"一轮带三个工具调用，按什么顺序执行？","answer":"按模型返回的顺序逐个执行，保存 assistant 请求后逐个追加 tool 结果。","followup":"","heading":"M06-B01 代码推演","anchor":"m06-b01-代码推演","answerHtml":"\u003cp>按模型返回的顺序逐个执行，保存 assistant 请求后逐个追加 tool 结果。\u003c/p>\n","followupHtml":""},{"id":"m06-b02","module":6,"level":"B","number":2,"question":"两个普通问答都没用工具，历史有哪些角色？","answer":"system、user、assistant、user、assistant。","followup":"","heading":"M06-B02 代码推演","anchor":"m06-b02-代码推演","answerHtml":"\u003cp>system、user、assistant、user、assistant。\u003c/p>\n","followupHtml":""},{"id":"m06-b03","module":6,"level":"B","number":3,"question":"第一个工具的参数是合法 JSON 数组，第二个工具正常，会怎样？","answer":"第一条结果报告必须是 JSON 对象，第二个调用仍执行。两条结果都携带各自的原 ID。","followup":"","heading":"M06-B03 代码推演","anchor":"m06-b03-代码推演","answerHtml":"\u003cp>第一条结果报告必须是 JSON 对象，第二个调用仍执行。两条结果都携带各自的原 ID。\u003c/p>\n","followupHtml":""},{"id":"m06-b04","module":6,"level":"B","number":4,"question":"max_turns=1，第一轮写文件成功，会怎样？","answer":"保存调用和写入结果，文件已经改变，向 CLI 返回达到轮数上限的提示。","followup":"","heading":"M06-B04 代码推演","anchor":"m06-b04-代码推演","answerHtml":"\u003cp>保存调用和写入结果，文件已经改变，向 CLI 返回达到轮数上限的提示。\u003c/p>\n","followupHtml":""},{"id":"m06-c01","module":6,"level":"C","number":1,"question":"统一执行入口解决了哪些问题？","answer":"在一处处理注册查找、解析、参数校验、工具异常与回传。主循环只管理请求和消息次序。","followup":"权限检查应插在参数验证前还是执行前？分别会影响什么？","heading":"M06-C01 面试追问","anchor":"m06-c01-面试追问","answerHtml":"\u003cp>在一处处理注册查找、解析、参数校验、工具异常与回传。主循环只管理请求和消息次序。\u003c/p>\n","followupHtml":"\u003cp>权限检查应插在参数验证前还是执行前？分别会影响什么？\u003c/p>\n"},{"id":"m06-c02","module":6,"level":"C","number":2,"question":"第二轮模型报错，已写的文件该如何解释？","answer":"历史保留第一次调用与结果；文件已经改变，当前项目没有跨工具事务或自动回滚。","followup":"","heading":"M06-C02 面试追问","anchor":"m06-c02-面试追问","answerHtml":"\u003cp>历史保留第一次调用与结果；文件已经改变，当前项目没有跨工具事务或自动回滚。\u003c/p>\n","followupHtml":""},{"id":"m06-c03","module":6,"level":"C","number":3,"question":"第一项已写文件，第二项被中断，第三项还没开始。历史应该怎么处理？","answer":"保留第一项结果。第二项补同 ID 的结果并标记状态未知，第三项补同 ID 的结果并标记未执行。最后把中断交还调用者，避免重跑有副作用的工具。","followup":"如何通过断言证明第三项从未启动，并且下一次请求仍能发送？","heading":"M06-C03 面试追问","anchor":"m06-c03-面试追问","answerHtml":"\u003cp>保留第一项结果。第二项补同 ID 的结果并标记状态未知，第三项补同 ID 的结果并标记未执行。最后把中断交还调用者，避免重跑有副作用的工具。\u003c/p>\n","followupHtml":"\u003cp>如何通过断言证明第三项从未启动，并且下一次请求仍能发送？\u003c/p>\n"},{"id":"m06-c04","module":6,"level":"C","number":4,"question":"模型返回文本就代表完成了任务吗？","answer":"工具状态和最终文本可能不一致。要核实文件内容或其他目标状态，必要时再测真实模型。","followup":"","heading":"M06-C04 面试追问","anchor":"m06-c04-面试追问","answerHtml":"\u003cp>工具状态和最终文本可能不一致。要核实文件内容或其他目标状态，必要时再测真实模型。\u003c/p>\n","followupHtml":""}],"sections":[{"title":"06.1 先把一次用户输入和一轮模型请求分开","id":"061-先把一次用户输入和一轮模型请求分开","search":"06.1 先把一次用户输入和一轮模型请求分开 一次 `run` 处理一条用户输入。一次 `for` 迭代包含一轮逻辑请求。如果第一轮返回两个工具请求，第二轮返回文本，就有一次用户输入、两轮模型决策、两次工具执行。网络重试可能额外增加请求尝试。"},{"title":"06.2 把大函数压成四个动作","id":"062-把大函数压成四个动作","search":"06.2 把大函数压成四个动作 ```text\n追加 user\n  ↓\n请求模型，转换成普通 assistant 字典\n  ├─ 带工具调用：保存 assistant → 逐条执行与追加 tool → 继续循环\n  └─ 带最终文本：保存 assistant → 返回文本给 CLI\n```\n\n打开 [agent.py](../MiniAgent/core/agent.py)，先看 `run` 怎样区分工具批次和最终回答。然后读 `_append_tool_batch` 怎样保存调用与结果，再读 `execute_tool` 怎样形成一条结果。\n\n复习时可以给三个函数各写一句话。`run` 管本次输入经历几轮模型请求。`_append_tool_batch` 管这批调用和结果怎样按 ID 排进历史。`execute_tool` 管单个工具能不能执行，以及怎样回传成功、拒绝或异常。把这三件事分开，面试时就能讲清问题发生在哪一层。\n\n[源码 · agent.py · run](../MiniAgent/core/agent.py#L220)"},{"title":"06.3 请求发出前后发生什么","id":"063-请求发出前后发生什么","search":"06.3 请求发出前后发生什么 请求用 `self.complete(**request)` 发送，`call_with_retry` 包住请求动作。`_assistant_message` 先看 `finish_reason`。普通文本要以 `stop` 结束，工具批次要以 `tool_calls` 结束。即使截断的响应里已有一条看起来完整的写文件请求，`length` 也会让整批在进入历史、执行工具之前被拒绝。 [DeepSeek 响应字段](https://api-docs.deepseek.com/api/create-chat-completion/)\n\n通过这一关后再检查字段形状和同批 ID。合格的 SDK 响应会被转换成普通字典，因此 `messages` 可以整体用 JSON 表示。\n\n[源码 · agent.py · _assistant_message](../MiniAgent/core/agent.py#L74)"},{"title":"06.4 工具分支逐步手推","id":"064-工具分支逐步手推","search":"06.4 工具分支逐步手推 假设第一轮要调用 `a=calculate(\"2+3\")` 和 `b=get_time()`。第一轮结束的历史为 `system → user → assistant(tool_calls=[a,b]) → tool(a,\"5\") → tool(b,时间)`。这个顺序也决定编程助手同轮先写后读时，后一个工具能读到前一个写进去的内容。\n\n把这个顺序和终端对照。先看到「第 1 轮 请求模型」，接着是两个工具各自的请求与状态，再看到「第 2 轮 请求模型」。第 2 轮读到的是已经补齐两个 `tool` 结果的历史。也可以用写文件练习观察跨轮行为，模型可能先用一轮读文件，再用另一轮写入。"},{"title":"06.5 为什么调用与结果必须配对","id":"065-为什么调用与结果必须配对","search":"06.5 为什么调用与结果必须配对 模型按 ID 找对应结果。如果 `a` 的参数 JSON 破了，`execute_tool` 会回一条 `role=\"tool\", tool_call_id=\"a\"` 的错误结果。随后照常执行 `b`。没有工具 ID 的响应无法配对，因此先检查协议形状，再写入历史。\n\n如果三条调用依次为 a、b、c，a 已完成，b 执行时被 Ctrl+C 打断，历史就保留 a 的结果，将 b 标为「完成状态未知」，将 c 标为「未执行」。`_append_tool_batch` 补齐相应 ID 后把中断交给上层，CLI 随即退出。如果在别处捕获中断并继续复用该 Agent，下一次请求仍能携带完整的调用与结果。\n\n[源码 · agent.py · execute_tool](../MiniAgent/core/agent.py#L153)"},{"title":"06.6 最终回答怎样进入历史","id":"066-最终回答怎样进入历史","search":"06.6 最终回答怎样进入历史 第二轮返回「结果是 5」时，先保存 `{\"role\":\"assistant\",\"content\":\"结果是 5\"}`，再把文本返回。下一条用户追问「刚才是多少」时，模型能看到这条旧回答。前一轮只有文本、完全没调工具时，同样会保存。"},{"title":"06.7 轮数到了以后，已执行动作怎样处理","id":"067-轮数到了以后已执行动作怎样处理","search":"06.7 轮数到了以后，已执行动作怎样处理 `max_turns=1` 时第一轮仍可调用工具。写入成功后，结果会保留，CLI 收到「已达到上限」提示。当前没有额外一次模型总结，也没有自动撤销文件修改。面试中可用这个例子说明预算和副作用的关系。"},{"title":"06.8 一张异常地图","id":"068-一张异常地图","search":"06.8 一张异常地图 | 失败 | 处理位置 | 结果 |\n|---|---|---|\n| 连接失败、HTTP 429、5xx | `call_with_retry` | 按规则重试请求 |\n| 空响应、生成截断、无法配对的调用 | `_assistant_message` 与 `run` | 执行前拒收响应，向 CLI 报错 |\n| JSON 格式错误、键重复、工具或参数不合法 | `execute_tool` | 写入同 ID 的拒绝结果 |\n| 工具预期失败或抛出异常 | `execute_tool` | 预期错误给出原因，意外错误给出异常类型 |\n| 首轮请求失败或被 Ctrl+C 中断 | `run` | 移除本次未得到响应的用户消息 |\n| 模型在工具执行后失败 | `run` | 保留已经配对的历史和实际产生的副作用 |\n| Ctrl+C 中断工具批次 | `_append_tool_batch` | 保留已完成结果，补齐其余 ID，停止执行 |"}],"heading":"06 主循环与消息协议","slug":"06-主循环与消息协议","line":1010,"html":"\u003ch3 id=\"061-先把一次用户输入和一轮模型请求分开\">06.1 先把一次用户输入和一轮模型请求分开\u003c/h3>\n\u003cp>一次 \u003ccode>run\u003c/code> 处理一条用户输入。一次 \u003ccode>for\u003c/code> 迭代包含一轮逻辑请求。如果第一轮返回两个工具请求，第二轮返回文本，就有一次用户输入、两轮模型决策、两次工具执行。网络重试可能额外增加请求尝试。\u003c/p>\n\u003ch3 id=\"062-把大函数压成四个动作\">06.2 把大函数压成四个动作\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">追加 user\n  ↓\n请求模型，转换成普通 assistant 字典\n  ├─ 带工具调用：保存 assistant → 逐条执行与追加 tool → 继续循环\n  └─ 带最终文本：保存 assistant → 返回文本给 CLI\n\u003c/code>\u003c/pre>\n\u003cp>打开 \u003ca href=\"../MiniAgent/core/agent.py\">agent.py\u003c/a>，先看 \u003ccode>run\u003c/code> 怎样区分工具批次和最终回答。然后读 \u003ccode>_append_tool_batch\u003c/code> 怎样保存调用与结果，再读 \u003ccode>execute_tool\u003c/code> 怎样形成一条结果。\u003c/p>\n\u003cp>复习时可以给三个函数各写一句话。\u003ccode>run\u003c/code> 管本次输入经历几轮模型请求。\u003ccode>_append_tool_batch\u003c/code> 管这批调用和结果怎样按 ID 排进历史。\u003ccode>execute_tool\u003c/code> 管单个工具能不能执行，以及怎样回传成功、拒绝或异常。把这三件事分开，面试时就能讲清问题发生在哪一层。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/core/agent.py#L220\">源码 · agent.py · run\u003c/a>\u003c/p>\n\u003ch3 id=\"063-请求发出前后发生什么\">06.3 请求发出前后发生什么\u003c/h3>\n\u003cp>请求用 \u003ccode>self.complete(**request)\u003c/code> 发送，\u003ccode>call_with_retry\u003c/code> 包住请求动作。\u003ccode>_assistant_message\u003c/code> 先看 \u003ccode>finish_reason\u003c/code>。普通文本要以 \u003ccode>stop\u003c/code> 结束，工具批次要以 \u003ccode>tool_calls\u003c/code> 结束。即使截断的响应里已有一条看起来完整的写文件请求，\u003ccode>length\u003c/code> 也会让整批在进入历史、执行工具之前被拒绝。 \u003ca href=\"https://api-docs.deepseek.com/api/create-chat-completion/\">DeepSeek 响应字段\u003c/a>\u003c/p>\n\u003cp>通过这一关后再检查字段形状和同批 ID。合格的 SDK 响应会被转换成普通字典，因此 \u003ccode>messages\u003c/code> 可以整体用 JSON 表示。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/core/agent.py#L74\">源码 · agent.py · _assistant_message\u003c/a>\u003c/p>\n\u003ch3 id=\"064-工具分支逐步手推\">06.4 工具分支逐步手推\u003c/h3>\n\u003cp>假设第一轮要调用 \u003ccode>a=calculate(&quot;2+3&quot;)\u003c/code> 和 \u003ccode>b=get_time()\u003c/code>。第一轮结束的历史为 \u003ccode>system → user → assistant(tool_calls=[a,b]) → tool(a,&quot;5&quot;) → tool(b,时间)\u003c/code>。这个顺序也决定编程助手同轮先写后读时，后一个工具能读到前一个写进去的内容。\u003c/p>\n\u003cp>把这个顺序和终端对照。先看到「第 1 轮 请求模型」，接着是两个工具各自的请求与状态，再看到「第 2 轮 请求模型」。第 2 轮读到的是已经补齐两个 \u003ccode>tool\u003c/code> 结果的历史。也可以用写文件练习观察跨轮行为，模型可能先用一轮读文件，再用另一轮写入。\u003c/p>\n\u003ch3 id=\"065-为什么调用与结果必须配对\">06.5 为什么调用与结果必须配对\u003c/h3>\n\u003cp>模型按 ID 找对应结果。如果 \u003ccode>a\u003c/code> 的参数 JSON 破了，\u003ccode>execute_tool\u003c/code> 会回一条 \u003ccode>role=&quot;tool&quot;, tool_call_id=&quot;a&quot;\u003c/code> 的错误结果。随后照常执行 \u003ccode>b\u003c/code>。没有工具 ID 的响应无法配对，因此先检查协议形状，再写入历史。\u003c/p>\n\u003cp>如果三条调用依次为 a、b、c，a 已完成，b 执行时被 Ctrl+C 打断，历史就保留 a 的结果，将 b 标为「完成状态未知」，将 c 标为「未执行」。\u003ccode>_append_tool_batch\u003c/code> 补齐相应 ID 后把中断交给上层，CLI 随即退出。如果在别处捕获中断并继续复用该 Agent，下一次请求仍能携带完整的调用与结果。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/core/agent.py#L153\">源码 · agent.py · execute_tool\u003c/a>\u003c/p>\n\u003ch3 id=\"066-最终回答怎样进入历史\">06.6 最终回答怎样进入历史\u003c/h3>\n\u003cp>第二轮返回「结果是 5」时，先保存 \u003ccode>{&quot;role&quot;:&quot;assistant&quot;,&quot;content&quot;:&quot;结果是 5&quot;}\u003c/code>，再把文本返回。下一条用户追问「刚才是多少」时，模型能看到这条旧回答。前一轮只有文本、完全没调工具时，同样会保存。\u003c/p>\n\u003ch3 id=\"067-轮数到了以后已执行动作怎样处理\">06.7 轮数到了以后，已执行动作怎样处理\u003c/h3>\n\u003cp>\u003ccode>max_turns=1\u003c/code> 时第一轮仍可调用工具。写入成功后，结果会保留，CLI 收到「已达到上限」提示。当前没有额外一次模型总结，也没有自动撤销文件修改。面试中可用这个例子说明预算和副作用的关系。\u003c/p>\n\u003ch3 id=\"068-一张异常地图\">06.8 一张异常地图\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>失败\u003c/th>\n\u003cth>处理位置\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>连接失败、HTTP 429、5xx\u003c/td>\n\u003ctd>\u003ccode>call_with_retry\u003c/code>\u003c/td>\n\u003ctd>按规则重试请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>空响应、生成截断、无法配对的调用\u003c/td>\n\u003ctd>\u003ccode>_assistant_message\u003c/code> 与 \u003ccode>run\u003c/code>\u003c/td>\n\u003ctd>执行前拒收响应，向 CLI 报错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JSON 格式错误、键重复、工具或参数不合法\u003c/td>\n\u003ctd>\u003ccode>execute_tool\u003c/code>\u003c/td>\n\u003ctd>写入同 ID 的拒绝结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具预期失败或抛出异常\u003c/td>\n\u003ctd>\u003ccode>execute_tool\u003c/code>\u003c/td>\n\u003ctd>预期错误给出原因，意外错误给出异常类型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>首轮请求失败或被 Ctrl+C 中断\u003c/td>\n\u003ctd>\u003ccode>run\u003c/code>\u003c/td>\n\u003ctd>移除本次未得到响应的用户消息\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型在工具执行后失败\u003c/td>\n\u003ctd>\u003ccode>run\u003c/code>\u003c/td>\n\u003ctd>保留已经配对的历史和实际产生的副作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ctrl+C 中断工具批次\u003c/td>\n\u003ctd>\u003ccode>_append_tool_batch\u003c/code>\u003c/td>\n\u003ctd>保留已完成结果，补齐其余 ID，停止执行\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"number":7,"id":"m07","title":"演示助手的四个工具","goal":"看懂四个演示工具和受限算术的求值过程。","questions":[{"id":"m07-a01","module":7,"level":"A","number":1,"question":"天气数据从哪里来？","answer":"来自源码里的固定城市字典。","followup":"","heading":"M07-A01 基础识别","anchor":"m07-a01-基础识别","answerHtml":"\u003cp>来自源码里的固定城市字典。\u003c/p>\n","followupHtml":""},{"id":"m07-a02","module":7,"level":"A","number":2,"question":"get_stock_price 实际返回什么？","answer":"股票代码和固定的 100 元演示价格。","followup":"","heading":"M07-A02 基础识别","anchor":"m07-a02-基础识别","answerHtml":"\u003cp>股票代码和固定的 100 元演示价格。\u003c/p>\n","followupHtml":""},{"id":"m07-a03","module":7,"level":"A","number":3,"question":"get_time 为什么适合演示无参工具？","answer":"它不要求工具参数，调用模型时参数对象可以是 {}，结果来自本机时间。","followup":"","heading":"M07-A03 基础识别","anchor":"m07-a03-基础识别","answerHtml":"\u003cp>它不要求工具参数，调用模型时参数对象可以是 {}，结果来自本机时间。\u003c/p>\n","followupHtml":""},{"id":"m07-a04","module":7,"level":"A","number":4,"question":"ast.parse 之后是谁做计算？","answer":"_arithmetic 递归读语法树，只执行白名单里定义的算术。","followup":"","heading":"M07-A04 基础识别","anchor":"m07-a04-基础识别","answerHtml":"\u003cp>_arithmetic 递归读语法树，只执行白名单里定义的算术。\u003c/p>\n","followupHtml":""},{"id":"m07-b01","module":7,"level":"B","number":1,"question":"天气字典找不到城市会怎样？","answer":"data.get 返回「暂无数据」，仍带有演示标签。","followup":"","heading":"M07-B01 代码推演","anchor":"m07-b01-代码推演","answerHtml":"\u003cp>data.get 返回「暂无数据」，仍带有演示标签。\u003c/p>\n","followupHtml":""},{"id":"m07-b02","module":7,"level":"B","number":2,"question":"模型给天气工具传了对象而非字符串，会在哪失败？","answer":"execute_tool 会在调用天气函数前拒绝错误类型。","followup":"","heading":"M07-B02 代码推演","anchor":"m07-b02-代码推演","answerHtml":"\u003cp>execute_tool 会在调用天气函数前拒绝错误类型。\u003c/p>\n","followupHtml":""},{"id":"m07-b03","module":7,"level":"B","number":3,"question":"calculate('1/0') 会怎样？","answer":"直接调用时抛 ToolError。经框架执行时会回传带原 ID 的错误结果。","followup":"","heading":"M07-B03 代码推演","anchor":"m07-b03-代码推演","answerHtml":"\u003cp>直接调用时抛 ToolError。经框架执行时会回传带原 ID 的错误结果。\u003c/p>\n","followupHtml":""},{"id":"m07-b04","module":7,"level":"B","number":4,"question":"表达式 2+3*4 怎样求出 14？","answer":"先递归求右侧的乘法节点 3*4，再计算外层加法。","followup":"","heading":"M07-B04 代码推演","anchor":"m07-b04-代码推演","answerHtml":"\u003cp>先递归求右侧的乘法节点 3*4，再计算外层加法。\u003c/p>\n","followupHtml":""},{"id":"m07-c01","module":7,"level":"C","number":1,"question":"把天气 mock 改成真实服务，应改哪里？","answer":"工具实现、超时和失败处理。工具输入输出仍符合原接口时，核心循环可继续复用。","followup":"","heading":"M07-C01 面试追问","anchor":"m07-c01-面试追问","answerHtml":"\u003cp>工具实现、超时和失败处理。工具输入输出仍符合原接口时，核心循环可继续复用。\u003c/p>\n","followupHtml":""},{"id":"m07-c02","module":7,"level":"C","number":2,"question":"try/except 为什么无法为 eval 提供权限边界？","answer":"异常只能处理出错，任意表达式的副作用可能早已执行。当前做法先解析，再按允许的节点求值。","followup":"","heading":"M07-C02 面试追问","anchor":"m07-c02-面试追问","answerHtml":"\u003cp>异常只能处理出错，任意表达式的副作用可能早已执行。当前做法先解析，再按允许的节点求值。\u003c/p>\n","followupHtml":""},{"id":"m07-c03","module":7,"level":"C","number":3,"question":"只读工具也要考虑什么？","answer":"读取的数据是否允许发送给模型，调用的成本与失败语义，以及外部内容可能影响模型判断。","followup":"","heading":"M07-C03 面试追问","anchor":"m07-c03-面试追问","answerHtml":"\u003cp>读取的数据是否允许发送给模型，调用的成本与失败语义，以及外部内容可能影响模型判断。\u003c/p>\n","followupHtml":""},{"id":"m07-c04","module":7,"level":"C","number":4,"question":"演示工具简单，面试可展示什么？","answer":"用简单工具说明同一运行时复用，再用失败配对、先写后读和测试证据展示工程点。","followup":"","heading":"M07-C04 面试追问","anchor":"m07-c04-面试追问","answerHtml":"\u003cp>用简单工具说明同一运行时复用，再用失败配对、先写后读和测试证据展示工程点。\u003c/p>\n","followupHtml":""}],"sections":[{"title":"07.1 角色提示放在应用层","id":"071-角色提示放在应用层","search":"07.1 角色提示放在应用层 `assistant.SYSTEM_PROMPT` 要求使用对应工具，并把固定数据标成演示。程序也在固定数据结果里附上「演示数据」标签。提示负责引导模型措辞，运行时负责校验调用。"},{"title":"07.2 天气工具就是字典查询","id":"072-天气工具就是字典查询","search":"07.2 天气工具就是字典查询 `data.get(city, \"暂无数据\")` 先查城市键，缺失时返回默认值。用北京和一个字典里不存在的城市各试一次，能看到命中和缺失两种结果。"},{"title":"07.3 计算器怎样只接受算术","id":"073-计算器怎样只接受算术","search":"07.3 计算器怎样只接受算术 `ast.parse(expression.strip(), mode=\"eval\")` 把文本解析成表达式语法树，解析这一步没有执行表达式。`_arithmetic` 只处理数字、允许的二元运算和一元正负。`2 + 3 * 4` 的乘法节点先算出 12，再算加法得 14。遇到函数调用、取属性、幂运算或布尔常量，会走拒绝分支。长度、中间数值与除零另有限制。\n\n[源码 · assistant.py · _arithmetic](../MiniAgent/apps/assistant.py#L27)"},{"title":"07.4 时间与股票分别是什么例子","id":"074-时间与股票分别是什么例子","search":"07.4 时间与股票分别是什么例子 `get_time()` 没有输入参数，返回带时区偏移的本机时间。`get_stock_price(code)` 接收字符串，但任何代码都返回固定的 100 元示例。自测时间时可以验证能解析出时区，避免断言一个会随时间变化的具体值。"},{"title":"07.5 从工具函数想到验证","id":"075-从工具函数想到验证","search":"07.5 从工具函数想到验证 直接调用 `calculate(\"1/0\")` 会抛出 `ToolError`。模型经 `execute_tool` 调用时，才会收到「工具失败」的结果。一个测试验证算术语义，一个测试验证框架把异常转换成协议消息。"}],"heading":"07 演示助手的四个工具","slug":"07-演示助手的四个工具","line":1220,"html":"\u003ch3 id=\"071-角色提示放在应用层\">07.1 角色提示放在应用层\u003c/h3>\n\u003cp>\u003ccode>assistant.SYSTEM_PROMPT\u003c/code> 要求使用对应工具，并把固定数据标成演示。程序也在固定数据结果里附上「演示数据」标签。提示负责引导模型措辞，运行时负责校验调用。\u003c/p>\n\u003ch3 id=\"072-天气工具就是字典查询\">07.2 天气工具就是字典查询\u003c/h3>\n\u003cp>\u003ccode>data.get(city, &quot;暂无数据&quot;)\u003c/code> 先查城市键，缺失时返回默认值。用北京和一个字典里不存在的城市各试一次，能看到命中和缺失两种结果。\u003c/p>\n\u003ch3 id=\"073-计算器怎样只接受算术\">07.3 计算器怎样只接受算术\u003c/h3>\n\u003cp>\u003ccode>ast.parse(expression.strip(), mode=&quot;eval&quot;)\u003c/code> 把文本解析成表达式语法树，解析这一步没有执行表达式。\u003ccode>_arithmetic\u003c/code> 只处理数字、允许的二元运算和一元正负。\u003ccode>2 + 3 * 4\u003c/code> 的乘法节点先算出 12，再算加法得 14。遇到函数调用、取属性、幂运算或布尔常量，会走拒绝分支。长度、中间数值与除零另有限制。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/apps/assistant.py#L27\">源码 · assistant.py · _arithmetic\u003c/a>\u003c/p>\n\u003ch3 id=\"074-时间与股票分别是什么例子\">07.4 时间与股票分别是什么例子\u003c/h3>\n\u003cp>\u003ccode>get_time()\u003c/code> 没有输入参数，返回带时区偏移的本机时间。\u003ccode>get_stock_price(code)\u003c/code> 接收字符串，但任何代码都返回固定的 100 元示例。自测时间时可以验证能解析出时区，避免断言一个会随时间变化的具体值。\u003c/p>\n\u003ch3 id=\"075-从工具函数想到验证\">07.5 从工具函数想到验证\u003c/h3>\n\u003cp>直接调用 \u003ccode>calculate(&quot;1/0&quot;)\u003c/code> 会抛出 \u003ccode>ToolError\u003c/code>。模型经 \u003ccode>execute_tool\u003c/code> 调用时，才会收到「工具失败」的结果。一个测试验证算术语义，一个测试验证框架把异常转换成协议消息。\u003c/p>\n"},{"number":8,"id":"m08","title":"文件路径与读写工具","goal":"解释路径解析、字节截断、独占创建与显式覆盖。","questions":[{"id":"m08-a01","module":8,"level":"A","number":1,"question":"工作区根目录来自哪里？","answer":"CLI 选默认目录或用户提供的 --workspace，再交给 build_tools 保存解析后的根目录。","followup":"","heading":"M08-A01 基础识别","anchor":"m08-a01-基础识别","answerHtml":"\u003cp>CLI 选默认目录或用户提供的 --workspace，再交给 build_tools 保存解析后的根目录。\u003c/p>\n","followupHtml":""},{"id":"m08-a02","module":8,"level":"A","number":2,"question":"_workspace_path 的两层检查各是什么？","answer":"_workspace_path 先拒绝不合规路径格式，再检查 resolve() 的结果仍在根目录内。","followup":"","heading":"M08-A02 基础识别","anchor":"m08-a02-基础识别","answerHtml":"\u003cp>_workspace_path 先拒绝不合规路径格式，再检查 resolve() 的结果仍在根目录内。\u003c/p>\n","followupHtml":""},{"id":"m08-a03","module":8,"level":"A","number":3,"question":"为何要读取 limit + 1 字节？","answer":"多读的那个字节只用来判断是否存在截断。","followup":"","heading":"M08-A03 基础识别","anchor":"m08-a03-基础识别","answerHtml":"\u003cp>多读的那个字节只用来判断是否存在截断。\u003c/p>\n","followupHtml":""},{"id":"m08-a04","module":8,"level":"A","number":4,"question":"xb 模式保护了什么？","answer":"仅在目标不存在时新建；已存在会抛 FileExistsError，原文件保持原样。","followup":"","heading":"M08-A04 基础识别","anchor":"m08-a04-基础识别","answerHtml":"\u003cp>仅在目标不存在时新建；已存在会抛 FileExistsError，原文件保持原样。\u003c/p>\n","followupHtml":""},{"id":"m08-b01","module":8,"level":"B","number":1,"question":"为什么使用 is_relative_to，而非字符串前缀？","answer":"路径按部件比较。相邻目录 workspace-other 的字符串前缀相同，但它不在 workspace 内。","followup":"","heading":"M08-B01 代码推演","anchor":"m08-b01-代码推演","answerHtml":"\u003cp>路径按部件比较。相邻目录 workspace-other 的字符串前缀相同，但它不在 workspace 内。\u003c/p>\n","followupHtml":""},{"id":"m08-b02","module":8,"level":"B","number":2,"question":"恰好 16 KiB 的文件是否显示截断？","answer":"未读到第 16 KiB 之后的额外字节时不显示。","followup":"","heading":"M08-B02 代码推演","anchor":"m08-b02-代码推演","answerHtml":"\u003cp>未读到第 16 KiB 之后的额外字节时不显示。\u003c/p>\n","followupHtml":""},{"id":"m08-b03","module":8,"level":"B","number":3,"question":"一行内容有五万字节，read_file 怎样返回？","answer":"依然按字节上限截断，行数不影响这个判断。","followup":"","heading":"M08-B03 代码推演","anchor":"m08-b03-代码推演","answerHtml":"\u003cp>依然按字节上限截断，行数不影响这个判断。\u003c/p>\n","followupHtml":""},{"id":"m08-b04","module":8,"level":"B","number":4,"question":"write_file 的 content 收到整数，模型调用时在哪失败？","answer":"execute_tool 按 string 类型拒绝，文件函数尚未开始。","followup":"","heading":"M08-B04 代码推演","anchor":"m08-b04-代码推演","answerHtml":"\u003cp>execute_tool 按 string 类型拒绝，文件函数尚未开始。\u003c/p>\n","followupHtml":""},{"id":"m08-c01","module":8,"level":"C","number":1,"question":"resolve 后还会有哪些边界？","answer":"检查与打开间可能被并发替换路径，同文件系统上的硬链接也不是符号链接。可信演示目录与更强的系统级隔离是不同层的控制。","followup":"","heading":"M08-C01 面试追问","anchor":"m08-c01-面试追问","answerHtml":"\u003cp>检查与打开间可能被并发替换路径，同文件系统上的硬链接也不是符号链接。可信演示目录与更强的系统级隔离是不同层的控制。\u003c/p>\n","followupHtml":""},{"id":"m08-c02","module":8,"level":"C","number":2,"question":"如何设计 edit_file 的最小正确行为？","answer":"用待匹配原文定位，恰好一次才替换；零处或多处匹配时保留文件。并发时还应验证版本。","followup":"为什么按行号盲改更容易写错？","heading":"M08-C02 面试追问","anchor":"m08-c02-面试追问","answerHtml":"\u003cp>用待匹配原文定位，恰好一次才替换；零处或多处匹配时保留文件。并发时还应验证版本。\u003c/p>\n","followupHtml":"\u003cp>为什么按行号盲改更容易写错？\u003c/p>\n"},{"id":"m08-c03","module":8,"level":"C","number":3,"question":"如何证明覆盖成功，避免只测创建？","answer":"先写第一版。分别试默认写入、没有确认回调的显式覆盖、用户拒绝的显式覆盖，读回文件确认仍是第一版。最后允许覆盖，再读回第二版。","followup":"","heading":"M08-C03 面试追问","anchor":"m08-c03-面试追问","answerHtml":"\u003cp>先写第一版。分别试默认写入、没有确认回调的显式覆盖、用户拒绝的显式覆盖，读回文件确认仍是第一版。最后允许覆盖，再读回第二版。\u003c/p>\n","followupHtml":""},{"id":"m08-c04","module":8,"level":"C","number":4,"question":"两个 Agent 同时写同一文件，当前有何保证？","answer":"独占创建保护新文件。覆盖在批准后与替换前检查目标文件是否改变。检查和替换之间仍有间隙，同时使用同一目录的进程需要更严格的并发协调。","followup":"","heading":"M08-C04 面试追问","anchor":"m08-c04-面试追问","answerHtml":"\u003cp>独占创建保护新文件。覆盖在批准后与替换前检查目标文件是否改变。检查和替换之间仍有间隙，同时使用同一目录的进程需要更严格的并发协调。\u003c/p>\n","followupHtml":""}],"sections":[{"title":"08.1 先定位路径基准","id":"081-先定位路径基准","search":"08.1 先定位路径基准 `build_tools(workspace)` 把目录解析为绝对路径，再定义和返回一组函数。内部函数引用 `root`，调用时就能知道这组工具属于哪个工作区。这是闭包。换一个目录调用一次 `build_tools`，就得到绑定新根目录的工具组。"},{"title":"08.2 路径检查究竟做了哪两件事","id":"082-路径检查究竟做了哪两件事","search":"08.2 路径检查究竟做了哪两件事 `_workspace_path` 先检查路径格式，拒绝绝对路径、盘符、父级段、控制字符，以及以点或空格结尾的 Windows 路径段等。再对 `root / relative` 调用 `resolve()`，用 `is_relative_to(root)` 检查解析后的路径归属。符号链接指向外部时，在第二步挡住。检查和打开文件之间仍有时间间隔，共享可写目录或硬链接需要更强的隔离措施。\n\n[源码 · coding_agent.py · _workspace_path](../MiniAgent/apps/coding_agent.py#L29)"},{"title":"08.3 读取按三个阶段走","id":"083-读取按三个阶段走","search":"08.3 读取按三个阶段走 先定位并检查是文件，再以 `rb` 读取最多 `limit + 1` 字节。第 `limit + 1` 个字节用来判断是否截断。最后用 UTF-8 解码并加提示。若字节上限落在汉字中间，增量解码器会保留未完成的尾部字节，返回完整字符。若前面的文本本身编码错误，则报 UTF-8 错误。\n\n[源码 · coding_agent.py · _bounded_read](../MiniAgent/apps/coding_agent.py#L49)"},{"title":"08.4 写入如何避免意外覆盖","id":"084-写入如何避免意外覆盖","search":"08.4 写入如何避免意外覆盖 `write_file` 先将文本编码成字节，超过 16 KiB 就拒绝。无论是否传入 `overwrite=True`，都先试用 `xb` 独占创建。这样另一个进程刚建好的文件也会进入已有文件分支。新建时写到一半出错，会尝试清理自己创建的残缺文件。\n\n目标已存在时，`overwrite=True` 只会发起覆盖请求，终端用户还要输入 `yes`。程序记录原文件的身份、大小和修改时间等信息，批准后复查。随后写入同目录的临时文件，替换前再复查一次。发现文件已变动就退出，原内容得以保留。最后一次检查与替换之间仍有并发间隙。\n\n[源码 · coding_agent.py · _write_text](../MiniAgent/apps/coding_agent.py#L86)"},{"title":"08.5 文件工具怎样接上核心","id":"085-文件工具怎样接上核心","search":"08.5 文件工具怎样接上核心 `list_files` 只列当前目录的直接子项，最多返回 100 项。三种文件工具都通过 `@tool` 带上参数说明。核心只知道工具名、参数和结果，不需要知道哪一个工具正在访问文件系统。"}],"heading":"08 文件路径与读写工具","slug":"08-文件路径与读写工具","line":1386,"html":"\u003ch3 id=\"081-先定位路径基准\">08.1 先定位路径基准\u003c/h3>\n\u003cp>\u003ccode>build_tools(workspace)\u003c/code> 把目录解析为绝对路径，再定义和返回一组函数。内部函数引用 \u003ccode>root\u003c/code>，调用时就能知道这组工具属于哪个工作区。这是闭包。换一个目录调用一次 \u003ccode>build_tools\u003c/code>，就得到绑定新根目录的工具组。\u003c/p>\n\u003ch3 id=\"082-路径检查究竟做了哪两件事\">08.2 路径检查究竟做了哪两件事\u003c/h3>\n\u003cp>\u003ccode>_workspace_path\u003c/code> 先检查路径格式，拒绝绝对路径、盘符、父级段、控制字符，以及以点或空格结尾的 Windows 路径段等。再对 \u003ccode>root / relative\u003c/code> 调用 \u003ccode>resolve()\u003c/code>，用 \u003ccode>is_relative_to(root)\u003c/code> 检查解析后的路径归属。符号链接指向外部时，在第二步挡住。检查和打开文件之间仍有时间间隔，共享可写目录或硬链接需要更强的隔离措施。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/apps/coding_agent.py#L29\">源码 · coding_agent.py · _workspace_path\u003c/a>\u003c/p>\n\u003ch3 id=\"083-读取按三个阶段走\">08.3 读取按三个阶段走\u003c/h3>\n\u003cp>先定位并检查是文件，再以 \u003ccode>rb\u003c/code> 读取最多 \u003ccode>limit + 1\u003c/code> 字节。第 \u003ccode>limit + 1\u003c/code> 个字节用来判断是否截断。最后用 UTF-8 解码并加提示。若字节上限落在汉字中间，增量解码器会保留未完成的尾部字节，返回完整字符。若前面的文本本身编码错误，则报 UTF-8 错误。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/apps/coding_agent.py#L49\">源码 · coding_agent.py · _bounded_read\u003c/a>\u003c/p>\n\u003ch3 id=\"084-写入如何避免意外覆盖\">08.4 写入如何避免意外覆盖\u003c/h3>\n\u003cp>\u003ccode>write_file\u003c/code> 先将文本编码成字节，超过 16 KiB 就拒绝。无论是否传入 \u003ccode>overwrite=True\u003c/code>，都先试用 \u003ccode>xb\u003c/code> 独占创建。这样另一个进程刚建好的文件也会进入已有文件分支。新建时写到一半出错，会尝试清理自己创建的残缺文件。\u003c/p>\n\u003cp>目标已存在时，\u003ccode>overwrite=True\u003c/code> 只会发起覆盖请求，终端用户还要输入 \u003ccode>yes\u003c/code>。程序记录原文件的身份、大小和修改时间等信息，批准后复查。随后写入同目录的临时文件，替换前再复查一次。发现文件已变动就退出，原内容得以保留。最后一次检查与替换之间仍有并发间隙。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/apps/coding_agent.py#L86\">源码 · coding_agent.py · _write_text\u003c/a>\u003c/p>\n\u003ch3 id=\"085-文件工具怎样接上核心\">08.5 文件工具怎样接上核心\u003c/h3>\n\u003cp>\u003ccode>list_files\u003c/code> 只列当前目录的直接子项，最多返回 100 项。三种文件工具都通过 \u003ccode>@tool\u003c/code> 带上参数说明。核心只知道工具名、参数和结果，不需要知道哪一个工具正在访问文件系统。\u003c/p>\n"},{"number":9,"id":"m09","title":"Python 脚本执行与权限边界","goal":"说清脚本注册、人工确认、启动、输出和系统权限。","questions":[{"id":"m09-a01","module":9,"level":"A","number":1,"question":"run_python 默认注册吗？","answer":"默认关闭。CLI 加 --enable-python 时才把带逐次确认的工具加入注册表。","followup":"","heading":"M09-A01 基础识别","anchor":"m09-a01-基础识别","answerHtml":"\u003cp>默认关闭。CLI 加 --enable-python 时才把带逐次确认的工具加入注册表。\u003c/p>\n","followupHtml":""},{"id":"m09-a02","module":9,"level":"A","number":2,"question":"cwd、timeout、stdin 分别管什么？","answer":"依次设定起始目录、等待时限、输入来源。脚本标准输入来自 DEVNULL。","followup":"","heading":"M09-A02 基础识别","anchor":"m09-a02-基础识别","answerHtml":"\u003cp>依次设定起始目录、等待时限、输入来源。脚本标准输入来自 DEVNULL。\u003c/p>\n","followupHtml":""},{"id":"m09-a03","module":9,"level":"A","number":3,"question":"为什么用 sys.executable 和参数列表？","answer":"确保使用当前 Python，含空格的脚本路径也能作为一个独立参数传入，无需解释 shell 文本。","followup":"","heading":"M09-A03 基础识别","anchor":"m09-a03-基础识别","answerHtml":"\u003cp>确保使用当前 Python，含空格的脚本路径也能作为一个独立参数传入，无需解释 shell 文本。\u003c/p>\n","followupHtml":""},{"id":"m09-a04","module":9,"level":"A","number":4,"question":"stdout 和 stderr 如何返回？","answer":"合并到临时文件，进程结束后最多读 4 KiB 正文并解码。","followup":"","heading":"M09-A04 基础识别","anchor":"m09-a04-基础识别","answerHtml":"\u003cp>合并到临时文件，进程结束后最多读 4 KiB 正文并解码。\u003c/p>\n","followupHtml":""},{"id":"m09-b01","module":9,"level":"B","number":1,"question":"用户输入的确认内容不是 yes，会怎样？","answer":"函数抛 ToolError，启动进程的调用尚未发生。","followup":"","heading":"M09-B01 代码推演","anchor":"m09-b01-代码推演","answerHtml":"\u003cp>函数抛 ToolError，启动进程的调用尚未发生。\u003c/p>\n","followupHtml":""},{"id":"m09-b02","module":9,"level":"B","number":2,"question":"脚本退出码是 3，同时打印了文本，会返回什么？","answer":"抛出包含退出码和有界输出的 ToolError。经统一入口后是一条对应的失败结果。","followup":"","heading":"M09-B02 代码推演","anchor":"m09-b02-代码推演","answerHtml":"\u003cp>抛出包含退出码和有界输出的 ToolError。经统一入口后是一条对应的失败结果。\u003c/p>\n","followupHtml":""},{"id":"m09-b03","module":9,"level":"B","number":3,"question":"cwd 在工作区，脚本能访问绝对路径吗？","answer":"能，是否有权访问取决于当前用户的系统权限。","followup":"","heading":"M09-B03 代码推演","anchor":"m09-b03-代码推演","answerHtml":"\u003cp>能，是否有权访问取决于当前用户的系统权限。\u003c/p>\n","followupHtml":""},{"id":"m09-b04","module":9,"level":"B","number":4,"question":"API Key 没有传给进程，脚本就一定读不到 Key 吗？","answer":"环境过滤只限制直接继承。脚本仍可能读取当前用户有权访问的配置文件。","followup":"","heading":"M09-B04 代码推演","anchor":"m09-b04-代码推演","answerHtml":"\u003cp>环境过滤只限制直接继承。脚本仍可能读取当前用户有权访问的配置文件。\u003c/p>\n","followupHtml":""},{"id":"m09-c01","module":9,"level":"C","number":1,"question":"如何验证拒绝时根本没启动进程？","answer":"把 _run_python 替换为 Mock，调用拒绝分支，再 assert_not_called。","followup":"","heading":"M09-C01 面试追问","anchor":"m09-c01-面试追问","answerHtml":"\u003cp>把 _run_python 替换为 Mock，调用拒绝分支，再 assert_not_called。\u003c/p>\n","followupHtml":""},{"id":"m09-c02","module":9,"level":"C","number":2,"question":"超时为何不能承诺清理所有后代进程？","answer":"当前实现等待并处理直接子进程。脚本自己启动的后代没有统一纳入进程组管理。","followup":"","heading":"M09-C02 面试追问","anchor":"m09-c02-面试追问","answerHtml":"\u003cp>当前实现等待并处理直接子进程。脚本自己启动的后代没有统一纳入进程组管理。\u003c/p>\n","followupHtml":""},{"id":"m09-c03","module":9,"level":"C","number":3,"question":"输出只回 4 KiB，磁盘也只占 4 KiB 吗？","answer":"输出先写临时文件。4 KiB 是反馈限制，运行期间临时文件可能更大。","followup":"","heading":"M09-C03 面试追问","anchor":"m09-c03-面试追问","answerHtml":"\u003cp>输出先写临时文件。4 KiB 是反馈限制，运行期间临时文件可能更大。\u003c/p>\n","followupHtml":""},{"id":"m09-c04","module":9,"level":"C","number":4,"question":"为什么保留脚本执行的用户确认？","answer":"脚本以当前用户权限运行，所以先把路径交给用户判断。批准后会复查文件身份、大小和时间等信息，发现变化就拒绝。最终复查与 Python 打开脚本之间仍有时间间隔，可信的工作目录仍然重要。","followup":"用户点了确认后，执行的是不是此前看到的文件版本？","heading":"M09-C04 面试追问","anchor":"m09-c04-面试追问","answerHtml":"\u003cp>脚本以当前用户权限运行，所以先把路径交给用户判断。批准后会复查文件身份、大小和时间等信息，发现变化就拒绝。最终复查与 Python 打开脚本之间仍有时间间隔，可信的工作目录仍然重要。\u003c/p>\n","followupHtml":"\u003cp>用户点了确认后，执行的是不是此前看到的文件版本？\u003c/p>\n"}],"sections":[{"title":"09.1 一条脚本请求的执行顺序","id":"091-一条脚本请求的执行顺序","search":"09.1 一条脚本请求的执行顺序 默认工具列表里没有 `run_python`。CLI 加 `--enable-python` 时传入批准函数，注册脚本工具。执行前检查工作区内的普通 `.py` 文件，再请终端用户确认。批准后复查路径与文件状态，两次检查之间有变化就拒绝启动。\n\n[源码 · coding_agent.py · run_python](../MiniAgent/apps/coding_agent.py#L173)"},{"title":"09.2 为什么用参数列表启动进程","id":"092-为什么用参数列表启动进程","search":"09.2 为什么用参数列表启动进程 传给 `subprocess.run` 的第一个参数是列表。第一个元素为 `sys.executable`，最后一个元素为脚本绝对路径，中间是 Python 的 UTF-8 和非缓冲输出选项。路径里有空格也作为一个参数传入，避免拼接成任意 shell 字符串。"},{"title":"09.3 subprocess 的参数各管一件事","id":"093-subprocess-的参数各管一件事","search":"09.3 subprocess 的参数各管一件事 | 参数 | 作用 |\n|---|---|\n| `cwd=root` | 设置进程起始目录 |\n| `env=environment` | 只继承 PATH 等少量变量，API Key 不直接传给子进程 |\n| `stdin=DEVNULL` | 让脚本不能从当前终端读输入 |\n| `stdout=output, stderr=STDOUT` | 标准输出和错误输出合并到临时文件 |\n| `timeout=15` | 等待脚本进程最多约 15 秒，超时按错误处理 |\n\n脚本拥有当前用户的系统权限。它仍可访问用户有权读取的其他文件、发网络请求或启动后代进程。请只批准你已检查和信任的脚本。当前超时针对直接子进程，临时文件在运行中的体积也没有 4 KiB 上限。\n\n[源码 · coding_agent.py · _run_python](../MiniAgent/apps/coding_agent.py#L190)"},{"title":"09.4 从 bytes 到文本","id":"094-从-bytes-到文本","search":"09.4 从 bytes 到文本 进程完成后将临时输出文件的读指针移回开头，取前 4 KiB 正文并以 UTF-8 解码。脚本可能产生非法 UTF-8 字节，因此这里用替换字符保留可读部分。退出码非零时，错误结果包含退出码和有界输出。"},{"title":"09.5 一次拒绝说明了什么","id":"095-一次拒绝说明了什么","search":"09.5 一次拒绝说明了什么 用户拒绝或脚本在确认期间改变时，都应停在启动前。自测把 `_run_python` 换成可记录调用的替身，并断言它从未被调用。另一个用例批准脚本并真正用本地解释器运行，以验证启动路径和环境。"}],"heading":"09 Python 脚本执行与权限边界","slug":"09-python-脚本执行与权限边界","line":1560,"html":"\u003ch3 id=\"091-一条脚本请求的执行顺序\">09.1 一条脚本请求的执行顺序\u003c/h3>\n\u003cp>默认工具列表里没有 \u003ccode>run_python\u003c/code>。CLI 加 \u003ccode>--enable-python\u003c/code> 时传入批准函数，注册脚本工具。执行前检查工作区内的普通 \u003ccode>.py\u003c/code> 文件，再请终端用户确认。批准后复查路径与文件状态，两次检查之间有变化就拒绝启动。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/apps/coding_agent.py#L173\">源码 · coding_agent.py · run_python\u003c/a>\u003c/p>\n\u003ch3 id=\"092-为什么用参数列表启动进程\">09.2 为什么用参数列表启动进程\u003c/h3>\n\u003cp>传给 \u003ccode>subprocess.run\u003c/code> 的第一个参数是列表。第一个元素为 \u003ccode>sys.executable\u003c/code>，最后一个元素为脚本绝对路径，中间是 Python 的 UTF-8 和非缓冲输出选项。路径里有空格也作为一个参数传入，避免拼接成任意 shell 字符串。\u003c/p>\n\u003ch3 id=\"093-subprocess-的参数各管一件事\">09.3 subprocess 的参数各管一件事\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>cwd=root\u003c/code>\u003c/td>\n\u003ctd>设置进程起始目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>env=environment\u003c/code>\u003c/td>\n\u003ctd>只继承 PATH 等少量变量，API Key 不直接传给子进程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>stdin=DEVNULL\u003c/code>\u003c/td>\n\u003ctd>让脚本不能从当前终端读输入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>stdout=output, stderr=STDOUT\u003c/code>\u003c/td>\n\u003ctd>标准输出和错误输出合并到临时文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>timeout=15\u003c/code>\u003c/td>\n\u003ctd>等待脚本进程最多约 15 秒，超时按错误处理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>脚本拥有当前用户的系统权限。它仍可访问用户有权读取的其他文件、发网络请求或启动后代进程。请只批准你已检查和信任的脚本。当前超时针对直接子进程，临时文件在运行中的体积也没有 4 KiB 上限。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/apps/coding_agent.py#L190\">源码 · coding_agent.py · _run_python\u003c/a>\u003c/p>\n\u003ch3 id=\"094-从-bytes-到文本\">09.4 从 bytes 到文本\u003c/h3>\n\u003cp>进程完成后将临时输出文件的读指针移回开头，取前 4 KiB 正文并以 UTF-8 解码。脚本可能产生非法 UTF-8 字节，因此这里用替换字符保留可读部分。退出码非零时，错误结果包含退出码和有界输出。\u003c/p>\n\u003ch3 id=\"095-一次拒绝说明了什么\">09.5 一次拒绝说明了什么\u003c/h3>\n\u003cp>用户拒绝或脚本在确认期间改变时，都应停在启动前。自测把 \u003ccode>_run_python\u003c/code> 换成可记录调用的替身，并断言它从未被调用。另一个用例批准脚本并真正用本地解释器运行，以验证启动路径和环境。\u003c/p>\n"},{"number":10,"id":"m10","title":"重试规则与指数退避","goal":"计算重试次数和等待顺序，理解副作用边界。","questions":[{"id":"m10-a01","module":10,"level":"A","number":1,"question":"哪些失败会重试？","answer":"连接与超时异常、HTTP 429 和 5xx。","followup":"","heading":"M10-A01 基础识别","anchor":"m10-a01-基础识别","answerHtml":"\u003cp>连接与超时异常、HTTP 429 和 5xx。\u003c/p>\n","followupHtml":""},{"id":"m10-a02","module":10,"level":"A","number":2,"question":"max_retries=2 最多调用几次？","answer":"一次初始尝试加两次重试，一共三次。","followup":"","heading":"M10-A02 基础识别","anchor":"m10-a02-基础识别","answerHtml":"\u003cp>一次初始尝试加两次重试，一共三次。\u003c/p>\n","followupHtml":""},{"id":"m10-a03","module":10,"level":"A","number":3,"question":"base_delay 在公式中做什么？","answer":"是第一个等待时间。下一次等待为它乘以 2。","followup":"","heading":"M10-A03 基础识别","anchor":"m10-a03-基础识别","answerHtml":"\u003cp>是第一个等待时间。下一次等待为它乘以 2。\u003c/p>\n","followupHtml":""},{"id":"m10-a04","module":10,"level":"A","number":4,"question":"裸 raise 在 except 中表示什么？","answer":"将当前捕获的原异常继续抛出。","followup":"","heading":"M10-A04 基础识别","anchor":"m10-a04-基础识别","answerHtml":"\u003cp>将当前捕获的原异常继续抛出。\u003c/p>\n","followupHtml":""},{"id":"m10-b01","module":10,"level":"B","number":1,"question":"默认连续三次可重试失败，等待序列是什么？","answer":"1 秒、2 秒。第三次已没有重试机会，直接抛出。","followup":"","heading":"M10-B01 代码推演","anchor":"m10-b01-代码推演","answerHtml":"\u003cp>1 秒、2 秒。第三次已没有重试机会，直接抛出。\u003c/p>\n","followupHtml":""},{"id":"m10-b02","module":10,"level":"B","number":2,"question":"第一次发生不可重试的 ValueError，会调用几次？","answer":"一次，无等待。","followup":"","heading":"M10-B02 代码推演","anchor":"m10-b02-代码推演","answerHtml":"\u003cp>一次，无等待。\u003c/p>\n","followupHtml":""},{"id":"m10-b03","module":10,"level":"B","number":3,"question":"max_retries=0 或 -1 会怎样？","answer":"0 表示尝试一次；负数触发 ValueError。","followup":"","heading":"M10-B03 代码推演","anchor":"m10-b03-代码推演","answerHtml":"\u003cp>0 表示尝试一次；负数触发 ValueError。\u003c/p>\n","followupHtml":""},{"id":"m10-b04","module":10,"level":"B","number":4,"question":"只把 base_delay 设为 0，能验证等待公式吗？","answer":"不能区分正确与错误的倍数。替换 sleep 并检查收到 1 和 2，才能验证默认序列。","followup":"","heading":"M10-B04 代码推演","anchor":"m10-b04-代码推演","answerHtml":"\u003cp>不能区分正确与错误的倍数。替换 sleep 并检查收到 1 和 2，才能验证默认序列。\u003c/p>\n","followupHtml":""},{"id":"m10-c01","module":10,"level":"C","number":1,"question":"SDK 与外层同时重试，会怎样？","answer":"外层的一次尝试可能包含多次 SDK 请求，放大时间与尝试数。当前 CLI 把 SDK 重试关掉。","followup":"","heading":"M10-C01 面试追问","anchor":"m10-c01-面试追问","answerHtml":"\u003cp>外层的一次尝试可能包含多次 SDK 请求，放大时间与尝试数。当前 CLI 把 SDK 重试关掉。\u003c/p>\n","followupHtml":""},{"id":"m10-c02","module":10,"level":"C","number":2,"question":"指数退避还有何不足？","answer":"许多客户端可能同时在相同间隔恢复请求，可以加随机扰动并遵守服务端建议时机。","followup":"","heading":"M10-C02 面试追问","anchor":"m10-c02-面试追问","answerHtml":"\u003cp>许多客户端可能同时在相同间隔恢复请求，可以加随机扰动并遵守服务端建议时机。\u003c/p>\n","followupHtml":""},{"id":"m10-c03","module":10,"level":"C","number":3,"question":"为什么当前重试边界只包模型请求？","answer":"工具可能有写文件等副作用。对整轮盲目重试可能重复执行已经完成的动作。","followup":"","heading":"M10-C03 面试追问","anchor":"m10-c03-面试追问","answerHtml":"\u003cp>工具可能有写文件等副作用。对整轮盲目重试可能重复执行已经完成的动作。\u003c/p>\n","followupHtml":""},{"id":"m10-c04","module":10,"level":"C","number":4,"question":"重试耗尽后怎么报错又便于定位？","answer":"CLI 显示异常类型或 HTTP 状态；日志的 request_failed 用 turn_id、round 和 error_type 做关联。","followup":"要定位每一次失败，下一步还需要记什么？","heading":"M10-C04 面试追问","anchor":"m10-c04-面试追问","answerHtml":"\u003cp>CLI 显示异常类型或 HTTP 状态；日志的 request_failed 用 turn_id、round 和 error_type 做关联。\u003c/p>\n","followupHtml":"\u003cp>要定位每一次失败，下一步还需要记什么？\u003c/p>\n"}],"sections":[{"title":"10.1 先判断失败原因，再决定要不要重复","id":"101-先判断失败原因再决定要不要重复","search":"10.1 先判断失败原因，再决定要不要重复 `APIConnectionError`、Python 的连接和超时异常、HTTP 429 及 5xx 属于当前重试范围。HTTP 401、400 和常见编程错误会直接抛出。身份错误通常需要改配置，反复用原请求不会修正它。"},{"title":"10.2 包装器为什么接收一个零参数函数","id":"102-包装器为什么接收一个零参数函数","search":"10.2 包装器为什么接收一个零参数函数 ```python\nresponse = call_with_retry(lambda: self.complete(**request))\n```\n\n这里传入的是执行请求的办法。重试器每尝试一次就调用一次 `func()`。若先执行 `self.complete(**request)` 再把响应交给重试器，第一次异常已经发生在重试器外面。\n\n[源码 · retry.py · call_with_retry](../MiniAgent/core/retry.py#L16)"},{"title":"10.3 手推默认的三次机会","id":"103-手推默认的三次机会","search":"10.3 手推默认的三次机会 `max_retries=2` 表示初次请求之外最多再试两次。前两次失败时依次等 1 秒、2 秒，第三次仍失败就抛出。`base_delay * 2 ** attempt` 中，`attempt` 从 0 开始。"},{"title":"10.4 测试、真实请求与重复副作用","id":"104-测试真实请求与重复副作用","search":"10.4 测试、真实请求与重复副作用 自测替换 `time.sleep`，检查记录的等待参数，所以不用真的等 3 秒。重试器包住模型请求，没有包住文件写入。SDK 的默认重试在 CLI 显式关闭，次数交由项目控制。`max_turns` 和请求重试分别统计。"},{"title":"10.5 还可以怎样改进","id":"105-还可以怎样改进","search":"10.5 还可以怎样改进 生产场景会考虑服务器给出的重试时机、指数退避加随机扰动，以及全任务时间预算。对会产生副作用的动作，还要先定义幂等性和重试条件。"}],"heading":"10 重试规则与指数退避","slug":"10-重试规则与指数退避","line":1738,"html":"\u003ch3 id=\"101-先判断失败原因再决定要不要重复\">10.1 先判断失败原因，再决定要不要重复\u003c/h3>\n\u003cp>\u00
