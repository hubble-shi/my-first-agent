3ccode>APIConnectionError\u003c/code>、Python 的连接和超时异常、HTTP 429 及 5xx 属于当前重试范围。HTTP 401、400 和常见编程错误会直接抛出。身份错误通常需要改配置，反复用原请求不会修正它。\u003c/p>\n\u003ch3 id=\"102-包装器为什么接收一个零参数函数\">10.2 包装器为什么接收一个零参数函数\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\">response = call_with_retry(lambda: self.complete(**request))\n\u003c/code>\u003c/pre>\n\u003cp>这里传入的是执行请求的办法。重试器每尝试一次就调用一次 \u003ccode>func()\u003c/code>。若先执行 \u003ccode>self.complete(**request)\u003c/code> 再把响应交给重试器，第一次异常已经发生在重试器外面。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/core/retry.py#L16\">源码 · retry.py · call_with_retry\u003c/a>\u003c/p>\n\u003ch3 id=\"103-手推默认的三次机会\">10.3 手推默认的三次机会\u003c/h3>\n\u003cp>\u003ccode>max_retries=2\u003c/code> 表示初次请求之外最多再试两次。前两次失败时依次等 1 秒、2 秒，第三次仍失败就抛出。\u003ccode>base_delay * 2 ** attempt\u003c/code> 中，\u003ccode>attempt\u003c/code> 从 0 开始。\u003c/p>\n\u003ch3 id=\"104-测试真实请求与重复副作用\">10.4 测试、真实请求与重复副作用\u003c/h3>\n\u003cp>自测替换 \u003ccode>time.sleep\u003c/code>，检查记录的等待参数，所以不用真的等 3 秒。重试器包住模型请求，没有包住文件写入。SDK 的默认重试在 CLI 显式关闭，次数交由项目控制。\u003ccode>max_turns\u003c/code> 和请求重试分别统计。\u003c/p>\n\u003ch3 id=\"105-还可以怎样改进\">10.5 还可以怎样改进\u003c/h3>\n\u003cp>生产场景会考虑服务器给出的重试时机、指数退避加随机扰动，以及全任务时间预算。对会产生副作用的动作，还要先定义幂等性和重试条件。\u003c/p>\n"},{"number":11,"id":"m11","title":"JSONL 日志与观测边界","goal":"按 ID 串起一次工具调用，说明日志的数据范围。","questions":[{"id":"m11-a01","module":11,"level":"A","number":1,"question":"JSONL 与一个 JSON 数组有什么区别？","answer":"每行各自是一条完整记录，可以逐行读或追加。","followup":"","heading":"M11-A01 基础识别","anchor":"m11-a01-基础识别","answerHtml":"\u003cp>每行各自是一条完整记录，可以逐行读或追加。\u003c/p>\n","followupHtml":""},{"id":"m11-a02","module":11,"level":"A","number":2,"question":"log_event 怎样形成 record？","answer":"先处理传入的字段，再补时间戳和事件名，最后编码为单行 JSON。","followup":"","heading":"M11-A02 基础识别","anchor":"m11-a02-基础识别","answerHtml":"\u003cp>先处理传入的字段，再补时间戳和事件名，最后编码为单行 JSON。\u003c/p>\n","followupHtml":""},{"id":"m11-a03","module":11,"level":"A","number":3,"question":"ensure_ascii=False 有什么作用？","answer":"中文以原字符写入 UTF-8 文件，更容易直接阅读。","followup":"","heading":"M11-A03 基础识别","anchor":"m11-a03-基础识别","answerHtml":"\u003cp>中文以原字符写入 UTF-8 文件，更容易直接阅读。\u003c/p>\n","followupHtml":""},{"id":"m11-a04","module":11,"level":"A","number":4,"question":"a 与 w 的日志写入模式有何差异？","answer":"a 在尾部追加；w 打开时会清空既有文件。","followup":"","heading":"M11-A04 基础识别","anchor":"m11-a04-基础识别","answerHtml":"\u003cp>a 在尾部追加；w 打开时会清空既有文件。\u003c/p>\n","followupHtml":""},{"id":"m11-b01","module":11,"level":"B","number":1,"question":"500 字符和 501 字符字段怎么处理？","answer":"前者完整保留，后者取前 500 字符。","followup":"","heading":"M11-B01 代码推演","anchor":"m11-b01-代码推演","answerHtml":"\u003cp>前者完整保留，后者取前 500 字符。\u003c/p>\n","followupHtml":""},{"id":"m11-b02","module":11,"level":"B","number":2,"question":"哪个字段可以配对一次工具调用？","answer":"同一轮中用相同 tool_call_id 对照 tool_call 和 tool_result。","followup":"","heading":"M11-B02 代码推演","anchor":"m11-b02-代码推演","answerHtml":"\u003cp>同一轮中用相同 tool_call_id 对照 tool_call 和 tool_result。\u003c/p>\n","followupHtml":""},{"id":"m11-b03","module":11,"level":"B","number":3,"question":"磁盘写失败会打断运行吗？","answer":"当前会捕获常见 I/O 错误，任务继续，日志可能少一条。","followup":"","heading":"M11-B03 代码推演","anchor":"m11-b03-代码推演","answerHtml":"\u003cp>当前会捕获常见 I/O 错误，任务继续，日志可能少一条。\u003c/p>\n","followupHtml":""},{"id":"m11-b04","module":11,"level":"B","number":4,"question":"log_event('x', ts='自定义') 的时间戳会是什么？","answer":"最终被 record.update 写入的当前时间覆盖。","followup":"","heading":"M11-B04 代码推演","anchor":"m11-b04-代码推演","answerHtml":"\u003cp>最终被 record.update 写入的当前时间覆盖。\u003c/p>\n","followupHtml":""},{"id":"m11-c01","module":11,"level":"C","number":1,"question":"为什么日志不能用来恢复会话？","answer":"它保留事件及状态，缺少消息正文、调用参数与工具结果。","followup":"","heading":"M11-C01 面试追问","anchor":"m11-c01-面试追问","answerHtml":"\u003cp>它保留事件及状态，缺少消息正文、调用参数与工具结果。\u003c/p>\n","followupHtml":""},{"id":"m11-c02","module":11,"level":"C","number":2,"question":"静默日志失败有何代价？","answer":"任务可继续，但可能没人发现观测中断。要求完整审计时需要明确失败策略。","followup":"","heading":"M11-C02 面试追问","anchor":"m11-c02-面试追问","answerHtml":"\u003cp>任务可继续，但可能没人发现观测中断。要求完整审计时需要明确失败策略。\u003c/p>\n","followupHtml":""},{"id":"m11-c03","module":11,"level":"C","number":3,"question":"已有事件日志，未来请求追踪补什么？","answer":"请求尝试、耗时、用量、完成状态，以及统一关联 ID。","followup":"为什么不能随手把整个请求 JSON 写进日志？","heading":"M11-C03 面试追问","anchor":"m11-c03-面试追问","answerHtml":"\u003cp>请求尝试、耗时、用量、完成状态，以及统一关联 ID。\u003c/p>\n","followupHtml":"\u003cp>为什么不能随手把整个请求 JSON 写进日志？\u003c/p>\n"},{"id":"m11-c04","module":11,"level":"C","number":4,"question":"怎样验证日志故障旁路？","answer":"在测试中让创建目录抛 OSError，调用 log_event 并确认异常没有传播。","followup":"","heading":"M11-C04 面试追问","anchor":"m11-c04-面试追问","answerHtml":"\u003cp>在测试中让创建目录抛 OSError，调用 log_event 并确认异常没有传播。\u003c/p>\n","followupHtml":""}],"sections":[{"title":"11.1 为什么先用结构化事件","id":"111-为什么先用结构化事件","search":"11.1 为什么先用结构化事件 每行都是一个可单独解析的 JSON 对象。一轮任务会有 `user_input`、`tool_call`、`tool_result` 和 `final_answer` 等事件，可以按 `turn_id` 过滤，再用 `tool_call_id` 对照工具开始与结束。\n\n终端和日志共用 Agent 发出的请求轮次、工具名和状态事件。CLI 把 `_print_event` 作为 `on_event` 传给 Agent。Agent 记录事件后调用它，CLI 再把事件翻译成「第几轮、请求了什么工具、执行状态如何」。观察过程不需要额外发模型请求，也不需要输出工具参数和正文。"},{"title":"11.2 从字段到磁盘的一条路径","id":"112-从字段到磁盘的一条路径","search":"11.2 从字段到磁盘的一条路径 `log_event(\"tool_result\", status=\"ok\", ...)` 先把字段整理成字典，补上事件名与本地时区时间，再用 `json.dumps` 序列化。日志文件按日期命名，以追加模式写入 `MiniAgent/logs`。测试把这个目录换成临时目录。\n\n[源码 · logger.py · log_event](../MiniAgent/core/logger.py#L11)"},{"title":"11.3 截断到底截了哪一层","id":"113-截断到底截了哪一层","search":"11.3 截断到底截了哪一层 日志帮助理解状态，所以运行时只传元数据，像用户原文、工具参数、文件内容和回答正文都没有传进日志函数。`value[:500]` 再限制顶层字符串字段长度。它是字段限长，不能用来清理嵌套结构或识别敏感信息。"},{"title":"11.4 日志失败为什么不打断主流程","id":"114-日志失败为什么不打断主流程","search":"11.4 日志失败为什么不打断主流程 目录创建、序列化、写入失败会被捕获，日志缺行时 Agent 仍可继续。结果是一次运行可能没有完整事件记录。测试可以让 `Path.mkdir` 人为抛出 `OSError`，检查 logger 安静返回。"},{"title":"11.5 日志与会话恢复的区别","id":"115-日志与会话恢复的区别","search":"11.5 日志与会话恢复的区别 当前日志可以回答「这一轮哪个工具被调用，结果状态是什么」。恢复会话还需要用户消息、助手消息、调用参数、结果和一致的顺序。计划中的请求追踪还要补延迟、请求尝试次数和模型用量等信息。"}],"heading":"11 JSONL 日志与观测边界","slug":"11-jsonl-日志与观测边界","line":1910,"html":"\u003ch3 id=\"111-为什么先用结构化事件\">11.1 为什么先用结构化事件\u003c/h3>\n\u003cp>每行都是一个可单独解析的 JSON 对象。一轮任务会有 \u003ccode>user_input\u003c/code>、\u003ccode>tool_call\u003c/code>、\u003ccode>tool_result\u003c/code> 和 \u003ccode>final_answer\u003c/code> 等事件，可以按 \u003ccode>turn_id\u003c/code> 过滤，再用 \u003ccode>tool_call_id\u003c/code> 对照工具开始与结束。\u003c/p>\n\u003cp>终端和日志共用 Agent 发出的请求轮次、工具名和状态事件。CLI 把 \u003ccode>_print_event\u003c/code> 作为 \u003ccode>on_event\u003c/code> 传给 Agent。Agent 记录事件后调用它，CLI 再把事件翻译成「第几轮、请求了什么工具、执行状态如何」。观察过程不需要额外发模型请求，也不需要输出工具参数和正文。\u003c/p>\n\u003ch3 id=\"112-从字段到磁盘的一条路径\">11.2 从字段到磁盘的一条路径\u003c/h3>\n\u003cp>\u003ccode>log_event(&quot;tool_result&quot;, status=&quot;ok&quot;, ...)\u003c/code> 先把字段整理成字典，补上事件名与本地时区时间，再用 \u003ccode>json.dumps\u003c/code> 序列化。日志文件按日期命名，以追加模式写入 \u003ccode>MiniAgent/logs\u003c/code>。测试把这个目录换成临时目录。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/core/logger.py#L11\">源码 · logger.py · log_event\u003c/a>\u003c/p>\n\u003ch3 id=\"113-截断到底截了哪一层\">11.3 截断到底截了哪一层\u003c/h3>\n\u003cp>日志帮助理解状态，所以运行时只传元数据，像用户原文、工具参数、文件内容和回答正文都没有传进日志函数。\u003ccode>value[:500]\u003c/code> 再限制顶层字符串字段长度。它是字段限长，不能用来清理嵌套结构或识别敏感信息。\u003c/p>\n\u003ch3 id=\"114-日志失败为什么不打断主流程\">11.4 日志失败为什么不打断主流程\u003c/h3>\n\u003cp>目录创建、序列化、写入失败会被捕获，日志缺行时 Agent 仍可继续。结果是一次运行可能没有完整事件记录。测试可以让 \u003ccode>Path.mkdir\u003c/code> 人为抛出 \u003ccode>OSError\u003c/code>，检查 logger 安静返回。\u003c/p>\n\u003ch3 id=\"115-日志与会话恢复的区别\">11.5 日志与会话恢复的区别\u003c/h3>\n\u003cp>当前日志可以回答「这一轮哪个工具被调用，结果状态是什么」。恢复会话还需要用户消息、助手消息、调用参数、结果和一致的顺序。计划中的请求追踪还要补延迟、请求尝试次数和模型用量等信息。\u003c/p>\n"},{"number":12,"id":"m12","title":"把 selftest 从头读懂","goal":"用准备、执行、断言和清理拆解离线测试。","questions":[{"id":"m12-a01","module":12,"level":"A","number":1,"question":"测试方法要按哪四步读？","answer":"准备、执行、断言、清理。","followup":"","heading":"M12-A01 基础识别","anchor":"m12-a01-基础识别","answerHtml":"\u003cp>准备、执行、断言、清理。\u003c/p>\n","followupHtml":""},{"id":"m12-a02","module":12,"level":"A","number":2,"question":"unittest 如何找到这些测试？","answer":"入口调用 unittest.main，执行 TestCase 子类中以 test_ 开头的方法。","followup":"","heading":"M12-A02 基础识别","anchor":"m12-a02-基础识别","answerHtml":"\u003cp>入口调用 unittest.main，执行 TestCase 子类中以 test_ 开头的方法。\u003c/p>\n","followupHtml":""},{"id":"m12-a03","module":12,"level":"A","number":3,"question":"ScriptedModel 做了哪两件事？","answer":"依次给出预设响应，并保存每次请求的深拷贝供断言使用。","followup":"","heading":"M12-A03 基础识别","anchor":"m12-a03-基础识别","answerHtml":"\u003cp>依次给出预设响应，并保存每次请求的深拷贝供断言使用。\u003c/p>\n","followupHtml":""},{"id":"m12-a04","module":12,"level":"A","number":4,"question":"终端里 skipped 算通过吗？","answer":"它表示该条件下未验证对应行为。整体可能返回成功，但报告时要单列跳过。","followup":"","heading":"M12-A04 基础识别","anchor":"m12-a04-基础识别","answerHtml":"\u003cp>它表示该条件下未验证对应行为。整体可能返回成功，但报告时要单列跳过。\u003c/p>\n","followupHtml":""},{"id":"m12-b01","module":12,"level":"B","number":1,"question":"输入只有短文本，截断断言会通过吗？","answer":"应当失败。用例要主动构造超过字节上限的内容。","followup":"","heading":"M12-B01 代码推演","anchor":"m12-b01-代码推演","answerHtml":"\u003cp>应当失败。用例要主动构造超过字节上限的内容。\u003c/p>\n","followupHtml":""},{"id":"m12-b02","module":12,"level":"B","number":2,"question":"为什么 UTF-8 用例在 limit - 1 个 ASCII 字节后追加汉字？","answer":"让字节上限落在多字节字符中间，以验证不会返回半个字符。","followup":"","heading":"M12-B02 代码推演","anchor":"m12-b02-代码推演","answerHtml":"\u003cp>让字节上限落在多字节字符中间，以验证不会返回半个字符。\u003c/p>\n","followupHtml":""},{"id":"m12-b03","module":12,"level":"B","number":3,"question":"为什么两次请求的 messages 需要快照？","answer":"同一个列表会持续追加。深拷贝后，旧请求保留当时发送的内容。","followup":"","heading":"M12-B03 代码推演","anchor":"m12-b03-代码推演","answerHtml":"\u003cp>同一个列表会持续追加。深拷贝后，旧请求保留当时发送的内容。\u003c/p>\n","followupHtml":""},{"id":"m12-b04","module":12,"level":"B","number":4,"question":"with self.assertRaises 中的调用抛出预期异常，会怎样？","answer":"断言通过；没有抛出或抛出其他类型时测试不会通过。","followup":"","heading":"M12-B04 代码推演","anchor":"m12-b04-代码推演","answerHtml":"\u003cp>断言通过；没有抛出或抛出其他类型时测试不会通过。\u003c/p>\n","followupHtml":""},{"id":"m12-c01","module":12,"level":"C","number":1,"question":"拒绝运行用例和超时用例都真的启动进程吗？","answer":"拒绝用 Mock 断言启动函数未调用；超时启动本地脚本并缩短测试时限。","followup":"","heading":"M12-C01 面试追问","anchor":"m12-c01-面试追问","answerHtml":"\u003cp>拒绝用 Mock 断言启动函数未调用；超时启动本地脚本并缩短测试时限。\u003c/p>\n","followupHtml":""},{"id":"m12-c02","module":12,"level":"C","number":2,"question":"SDK 替身能验证什么？","answer":"让真实 SDK 序列化请求并解析预设响应，同时校验写入、回读与工具结果，HTTP 通过本地替身处理。","followup":"","heading":"M12-C02 面试追问","anchor":"m12-c02-面试追问","answerHtml":"\u003cp>让真实 SDK 序列化请求并解析预设响应，同时校验写入、回读与工具结果，HTTP 通过本地替身处理。\u003c/p>\n","followupHtml":""},{"id":"m12-c03","module":12,"level":"C","number":3,"question":"优先补什么失败用例来守住主循环？","answer":"从副作用风险出发，先测截断响应完全不执行工具，再测批次被中断时保留已完成结果且不执行剩余工具。还要检查空响应、缺失或重复 ID、最终回答进入下一轮等协议用例。","followup":"只断言最终一句话为什么不足？","heading":"M12-C03 面试追问","anchor":"m12-c03-面试追问","answerHtml":"\u003cp>从副作用风险出发，先测截断响应完全不执行工具，再测批次被中断时保留已完成结果且不执行剩余工具。还要检查空响应、缺失或重复 ID、最终回答进入下一轮等协议用例。\u003c/p>\n","followupHtml":"\u003cp>只断言最终一句话为什么不足？\u003c/p>\n"},{"id":"m12-c04","module":12,"level":"C","number":4,"question":"全绿的离线自测能代表模型成功率吗？","answer":"离线回复是预设的，结果证明程序行为。模型成功率需要定义任务、标准和真实运行样本。","followup":"","heading":"M12-C04 面试追问","anchor":"m12-c04-面试追问","answerHtml":"\u003cp>离线回复是预设的，结果证明程序行为。模型成功率需要定义任务、标准和真实运行样本。\u003c/p>\n","followupHtml":""}],"sections":[{"title":"12.1 测试在回答哪一层的问题","id":"121-测试在回答哪一层的问题","search":"12.1 测试在回答哪一层的问题 从仓库根目录运行 `python MiniAgent/selftest.py`。一个测试通常有四步：**准备输入、执行动作、比较结果、清理现场**。先找测试名字，再定位 `self.assert...`。断言告诉你作者想证明什么。\n\n| 类 | 在验证什么 | 需要真实模型吗 |\n|---|---|---|\n| `AgentTests` | 消息顺序、ID 配对、坏响应、轮数、终端进度和 SDK 往返 | 无，使用预设回复或模拟 HTTP |\n| `WorkspaceTests` | UTF-8、写入与覆盖、路径、脚本确认、输出和超时 | 无，会运行测试自己写的短脚本 |\n| `UtilityTests` | 算术白名单、重试条件、日志失败旁路 | 无 |"},{"title":"12.2 unittest 怎样找到测试","id":"122-unittest-怎样找到测试","search":"12.2 unittest 怎样找到测试 文件末尾的 `unittest.main(verbosity=2)` 会在本文件寻找 `unittest.TestCase` 子类，执行名字以 `test_` 开头的方法。每个方法执行前先跑该类的 `setUp`。`self.enterContext(...)` 会登记清理动作，测试成功或失败后都能恢复补丁、清理临时文件。"},{"title":"12.3 如何让模型按剧本回答","id":"123-如何让模型按剧本回答","search":"12.3 如何让模型按剧本回答 ```python\nmodel = ScriptedModel(\n    response(calls=[call(\"a\", \"calculate\", '{\"expression\":\"2+3\"}')]),\n    response(\"结果是 5。\"),\n)\nagent = Agent(assistant.TOOLS, \"助手\", complete=model.complete, model=\"fake\")\n```\n\n这是一个缩小的例子。`ScriptedModel` 用 `iter` 保存准备好的响应，用 `next` 每次取一条。`complete(**request)` 还把这次请求深拷贝到 `self.requests`。你可以在第二轮检查历史，确认第一次的工具结果已经回传。若只保留原列表引用，后来追加的消息会改变你看到的旧请求。\n\n[源码 · selftest.py · class ScriptedModel](../MiniAgent/selftest.py#L38)"},{"title":"12.4 如何读同轮多工具与历史断言","id":"124-如何读同轮多工具与历史断言","search":"12.4 如何读同轮多工具与历史断言 找 `test_two_tools_and_followup_use_message_history`，先把下表右列遮住，自行推一次。\n\n| 取哪个记录 | 你应该能看到什么 |\n|---|---|\n| `model.requests[0][\"messages\"]` | `system, user`，此时没有模型响应 |\n| `model.requests[1][\"messages\"]` | `system, user, assistant, tool, tool`，两个工具结果分别关联 a、b |\n| `model.requests[2][\"messages\"][-2]` | 上一次最终回答；这一轮新的 user 在它后面 |\n\n测试能证明程序送出了正确的上下文。第三条回复由测试预设，模型实际会不会理解「刚才」需要在线试跑或独立评测。\n\n再看 `test_interrupted_tool_batch_keeps_protocol_and_does_not_replay`。替身工具先记录自己被调用，再在第二项抛出 `KeyboardInterrupt`。测试断言只有两次调用，历史仍有三个配对结果。随后再次调用 Agent，检查下一次请求确实携带这组完整结果。\n\n最后看 `test_cli_progress_reports_requests_and_tool_results_in_order`。剧本在同一轮安排两次计算，先做 `1/0`，再做 `13*17`。第一个失败，第二个仍能成功。`StringIO()` 相当于内存里的终端，`redirect_stdout(output)` 暂时把 `print` 写到那里。`splitlines()` 将捕获的文字拆成列表，断言逐行比较「第一轮请求 → 第一个工具失败 → 第二个工具成功 → 第二轮请求」。这项测试检查你在 Trae 看到的进度。上面的历史断言检查模型下一轮收到的数据。\n\n[源码 · selftest.py · test_two_tools_and_followup_use_message_history](../MiniAgent/selftest.py#L59)\n\n[源码 · selftest.py · test_cli_progress_reports_requests_and_tool_results_in_order](../MiniAgent/selftest.py#L77)"},{"title":"12.5 文件覆盖与 UTF-8 断言分别证明什么","id":"125-文件覆盖与-utf-8-断言分别证明什么","search":"12.5 文件覆盖与 UTF-8 断言分别证明什么 `test_write_requires_explicit_overwrite_and_user_confirmation` 先写第一版，再分别验证默认写入、没有确认回调、用户拒绝时都能保住旧内容。最后让确认替身返回 `True`，覆盖并读回第二版。另有测试让批准回调同时修改原文件，验证程序会保留较新的内容。\n\n`test_failed_creation_cleans_up_partial_file` 让替身先写一个字节再抛出 I/O 错误，断言失败后没有残留文件。`test_file_limits_count_bytes_and_keep_valid_unicode` 用 `limit - 1` 个 ASCII 字节接一个汉字，把边界卡在字符中间，断言返回的是完整字符。\n\n[源码 · selftest.py · test_file_limits_count_bytes_and_keep_valid_unicode](../MiniAgent/selftest.py#L349)"},{"title":"12.6 脚本测试何时真的启动子进程","id":"126-脚本测试何时真的启动子进程","search":"12.6 脚本测试何时真的启动子进程 拒绝用例和确认期间修改脚本的用例都把 `_run_python` 替换成 Mock，再断言 `assert_not_called()`。允许用例写一个临时 `demo.py`，真正启动本地解释器并检查输出。超时用例写入 `sleep(5)`，只在测试里把限时改成 0.3 秒。测试脚本均由测试自身生成。\n\n[源码 · selftest.py · test_python_is_opt_in_and_denial_does_not_start_a_process](../MiniAgent/selftest.py#L381)"},{"title":"12.7 从 SDK 的离线测试读到真实协议","id":"127-从-sdk-的离线测试读到真实协议","search":"12.7 从 SDK 的离线测试读到真实协议 `test_sdk_roundtrip_without_network` 用 `httpx.MockTransport(handler)` 为 SDK 提供本地 HTTP 替身。第一次回两个调用，要求先写文件再读文件。第二次检查送给模型的请求确有读回内容。这同时验证 SDK 数据转换、工具顺序、实际写入和回传格式。预设回复只验证协议与运行时，线上模型选工具的表现要另测。\n\n[源码 · selftest.py · test_sdk_roundtrip_without_network](../MiniAgent/selftest.py#L248)"},{"title":"12.8 怎样手推 flaky 和重试断言","id":"128-怎样手推-flaky-和重试断言","search":"12.8 怎样手推 flaky 和重试断言 迭代器准备 `TimeoutError()`、`ConnectionError()` 和 `\"ok\"`。前三次调用分别取一个。用 `patch.object(retry.time, \"sleep\")` 记下等待参数，并断言为 `[1, 2]`。不用真的等，就能验证次数和公式。\n\n[源码 · selftest.py · test_transient_error_retries_with_backoff](../MiniAgent/selftest.py#L435)"},{"title":"12.9 预期异常为什么算通过","id":"129-预期异常为什么算通过","search":"12.9 预期异常为什么算通过 ```python\nwith self.assertRaises(ToolError):\n    write(\"sub/note.txt\", \"意外覆盖\")\n```\n\n这里把「必须拒绝」写成测试。若没有抛出 `ToolError`，断言失败。要验证确实没有误写，还要再读文件，检查旧内容未变。`assertRaisesRegex` 可进一步验证失败原因，避免别的 `ToolError` 让断言意外通过。"},{"title":"12.10 清理、退出码与测试结果","id":"1210-清理退出码与测试结果","search":"12.10 清理、退出码与测试结果 正常用例打印 `ok`，断言不符会打印失败信息，未预期异常显示为 `ERROR`。系统禁止创建符号链接时，该用例会标为 `skipped`。终端中的 `Ran` 包含跳过的用例；请同时看最终状态与跳过数量。测试通过时进程退出码是 0，有失败时是非 0。\n\n当前版本在本机的结果是 `Ran 25 tests`、`OK (skipped=1)`，也就是 24 项通过，符号链接用例因系统权限跳过。在允许创建符号链接的环境里，这项会实际执行。"},{"title":"12.11 用一个改动确认自己看懂了","id":"1211-用一个改动确认自己看懂了","search":"12.11 用一个改动确认自己看懂了 先预测：如果暂时删掉 `run` 里保存最终 assistant 的那一步，哪条断言会先出问题？运行时应在第三次请求的历史检查失败。读完后可以在独立练习副本试一次，再恢复。面试时说出测试证明的行为，最后说出它覆盖不到的线上表现。"}],"heading":"12 把 selftest 从头读懂","slug":"12-把-selftest-从头读懂","line":2080,"html":"\u003ch3 id=\"121-测试在回答哪一层的问题\">12.1 测试在回答哪一层的问题\u003c/h3>\n\u003cp>从仓库根目录运行 \u003ccode>python MiniAgent/selftest.py\u003c/code>。一个测试通常有四步：\u003cstrong>准备输入、执行动作、比较结果、清理现场\u003c/strong>。先找测试名字，再定位 \u003ccode>self.assert...\u003c/code>。断言告诉你作者想证明什么。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类\u003c/th>\n\u003cth>在验证什么\u003c/th>\n\u003cth>需要真实模型吗\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>AgentTests\u003c/code>\u003c/td>\n\u003ctd>消息顺序、ID 配对、坏响应、轮数、终端进度和 SDK 往返\u003c/td>\n\u003ctd>无，使用预设回复或模拟 HTTP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>WorkspaceTests\u003c/code>\u003c/td>\n\u003ctd>UTF-8、写入与覆盖、路径、脚本确认、输出和超时\u003c/td>\n\u003ctd>无，会运行测试自己写的短脚本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>UtilityTests\u003c/code>\u003c/td>\n\u003ctd>算术白名单、重试条件、日志失败旁路\u003c/td>\n\u003ctd>无\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"122-unittest-怎样找到测试\">12.2 unittest 怎样找到测试\u003c/h3>\n\u003cp>文件末尾的 \u003ccode>unittest.main(verbosity=2)\u003c/code> 会在本文件寻找 \u003ccode>unittest.TestCase\u003c/code> 子类，执行名字以 \u003ccode>test_\u003c/code> 开头的方法。每个方法执行前先跑该类的 \u003ccode>setUp\u003c/code>。\u003ccode>self.enterContext(...)\u003c/code> 会登记清理动作，测试成功或失败后都能恢复补丁、清理临时文件。\u003c/p>\n\u003ch3 id=\"123-如何让模型按剧本回答\">12.3 如何让模型按剧本回答\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\">model = ScriptedModel(\n    response(calls=[call(&quot;a&quot;, &quot;calculate&quot;, &#39;{&quot;expression&quot;:&quot;2+3&quot;}&#39;)]),\n    response(&quot;结果是 5。&quot;),\n)\nagent = Agent(assistant.TOOLS, &quot;助手&quot;, complete=model.complete, model=&quot;fake&quot;)\n\u003c/code>\u003c/pre>\n\u003cp>这是一个缩小的例子。\u003ccode>ScriptedModel\u003c/code> 用 \u003ccode>iter\u003c/code> 保存准备好的响应，用 \u003ccode>next\u003c/code> 每次取一条。\u003ccode>complete(**request)\u003c/code> 还把这次请求深拷贝到 \u003ccode>self.requests\u003c/code>。你可以在第二轮检查历史，确认第一次的工具结果已经回传。若只保留原列表引用，后来追加的消息会改变你看到的旧请求。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/selftest.py#L38\">源码 · selftest.py · class ScriptedModel\u003c/a>\u003c/p>\n\u003ch3 id=\"124-如何读同轮多工具与历史断言\">12.4 如何读同轮多工具与历史断言\u003c/h3>\n\u003cp>找 \u003ccode>test_two_tools_and_followup_use_message_history\u003c/code>，先把下表右列遮住，自行推一次。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>取哪个记录\u003c/th>\n\u003cth>你应该能看到什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>model.requests[0][&quot;messages&quot;]\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>system, user\u003c/code>，此时没有模型响应\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>model.requests[1][&quot;messages&quot;]\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>system, user, assistant, tool, tool\u003c/code>，两个工具结果分别关联 a、b\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>model.requests[2][&quot;messages&quot;][-2]\u003c/code>\u003c/td>\n\u003ctd>上一次最终回答；这一轮新的 user 在它后面\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>测试能证明程序送出了正确的上下文。第三条回复由测试预设，模型实际会不会理解「刚才」需要在线试跑或独立评测。\u003c/p>\n\u003cp>再看 \u003ccode>test_interrupted_tool_batch_keeps_protocol_and_does_not_replay\u003c/code>。替身工具先记录自己被调用，再在第二项抛出 \u003ccode>KeyboardInterrupt\u003c/code>。测试断言只有两次调用，历史仍有三个配对结果。随后再次调用 Agent，检查下一次请求确实携带这组完整结果。\u003c/p>\n\u003cp>最后看 \u003ccode>test_cli_progress_reports_requests_and_tool_results_in_order\u003c/code>。剧本在同一轮安排两次计算，先做 \u003ccode>1/0\u003c/code>，再做 \u003ccode>13*17\u003c/code>。第一个失败，第二个仍能成功。\u003ccode>StringIO()\u003c/code> 相当于内存里的终端，\u003ccode>redirect_stdout(output)\u003c/code> 暂时把 \u003ccode>print\u003c/code> 写到那里。\u003ccode>splitlines()\u003c/code> 将捕获的文字拆成列表，断言逐行比较「第一轮请求 → 第一个工具失败 → 第二个工具成功 → 第二轮请求」。这项测试检查你在 Trae 看到的进度。上面的历史断言检查模型下一轮收到的数据。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/selftest.py#L59\">源码 · selftest.py · test_two_tools_and_followup_use_message_history\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/selftest.py#L77\">源码 · selftest.py · test_cli_progress_reports_requests_and_tool_results_in_order\u003c/a>\u003c/p>\n\u003ch3 id=\"125-文件覆盖与-utf-8-断言分别证明什么\">12.5 文件覆盖与 UTF-8 断言分别证明什么\u003c/h3>\n\u003cp>\u003ccode>test_write_requires_explicit_overwrite_and_user_confirmation\u003c/code> 先写第一版，再分别验证默认写入、没有确认回调、用户拒绝时都能保住旧内容。最后让确认替身返回 \u003ccode>True\u003c/code>，覆盖并读回第二版。另有测试让批准回调同时修改原文件，验证程序会保留较新的内容。\u003c/p>\n\u003cp>\u003ccode>test_failed_creation_cleans_up_partial_file\u003c/code> 让替身先写一个字节再抛出 I/O 错误，断言失败后没有残留文件。\u003ccode>test_file_limits_count_bytes_and_keep_valid_unicode\u003c/code> 用 \u003ccode>limit - 1\u003c/code> 个 ASCII 字节接一个汉字，把边界卡在字符中间，断言返回的是完整字符。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/selftest.py#L349\">源码 · selftest.py · test_file_limits_count_bytes_and_keep_valid_unicode\u003c/a>\u003c/p>\n\u003ch3 id=\"126-脚本测试何时真的启动子进程\">12.6 脚本测试何时真的启动子进程\u003c/h3>\n\u003cp>拒绝用例和确认期间修改脚本的用例都把 \u003ccode>_run_python\u003c/code> 替换成 Mock，再断言 \u003ccode>assert_not_called()\u003c/code>。允许用例写一个临时 \u003ccode>demo.py\u003c/code>，真正启动本地解释器并检查输出。超时用例写入 \u003ccode>sleep(5)\u003c/code>，只在测试里把限时改成 0.3 秒。测试脚本均由测试自身生成。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/selftest.py#L381\">源码 · selftest.py · test_python_is_opt_in_and_denial_does_not_start_a_process\u003c/a>\u003c/p>\n\u003ch3 id=\"127-从-sdk-的离线测试读到真实协议\">12.7 从 SDK 的离线测试读到真实协议\u003c/h3>\n\u003cp>\u003ccode>test_sdk_roundtrip_without_network\u003c/code> 用 \u003ccode>httpx.MockTransport(handler)\u003c/code> 为 SDK 提供本地 HTTP 替身。第一次回两个调用，要求先写文件再读文件。第二次检查送给模型的请求确有读回内容。这同时验证 SDK 数据转换、工具顺序、实际写入和回传格式。预设回复只验证协议与运行时，线上模型选工具的表现要另测。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/selftest.py#L248\">源码 · selftest.py · test_sdk_roundtrip_without_network\u003c/a>\u003c/p>\n\u003ch3 id=\"128-怎样手推-flaky-和重试断言\">12.8 怎样手推 flaky 和重试断言\u003c/h3>\n\u003cp>迭代器准备 \u003ccode>TimeoutError()\u003c/code>、\u003ccode>ConnectionError()\u003c/code> 和 \u003ccode>&quot;ok&quot;\u003c/code>。前三次调用分别取一个。用 \u003ccode>patch.object(retry.time, &quot;sleep&quot;)\u003c/code> 记下等待参数，并断言为 \u003ccode>[1, 2]\u003c/code>。不用真的等，就能验证次数和公式。\u003c/p>\n\u003cp>\u003ca href=\"../MiniAgent/selftest.py#L435\">源码 · selftest.py · test_transient_error_retries_with_backoff\u003c/a>\u003c/p>\n\u003ch3 id=\"129-预期异常为什么算通过\">12.9 预期异常为什么算通过\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\">with self.assertRaises(ToolError):\n    write(&quot;sub/note.txt&quot;, &quot;意外覆盖&quot;)\n\u003c/code>\u003c/pre>\n\u003cp>这里把「必须拒绝」写成测试。若没有抛出 \u003ccode>ToolError\u003c/code>，断言失败。要验证确实没有误写，还要再读文件，检查旧内容未变。\u003ccode>assertRaisesRegex\u003c/code> 可进一步验证失败原因，避免别的 \u003ccode>ToolError\u003c/code> 让断言意外通过。\u003c/p>\n\u003ch3 id=\"1210-清理退出码与测试结果\">12.10 清理、退出码与测试结果\u003c/h3>\n\u003cp>正常用例打印 \u003ccode>ok\u003c/code>，断言不符会打印失败信息，未预期异常显示为 \u003ccode>ERROR\u003c/code>。系统禁止创建符号链接时，该用例会标为 \u003ccode>skipped\u003c/code>。终端中的 \u003ccode>Ran\u003c/code> 包含跳过的用例；请同时看最终状态与跳过数量。测试通过时进程退出码是 0，有失败时是非 0。\u003c/p>\n\u003cp>当前版本在本机的结果是 \u003ccode>Ran 25 tests\u003c/code>、\u003ccode>OK (skipped=1)\u003c/code>，也就是 24 项通过，符号链接用例因系统权限跳过。在允许创建符号链接的环境里，这项会实际执行。\u003c/p>\n\u003ch3 id=\"1211-用一个改动确认自己看懂了\">12.11 用一个改动确认自己看懂了\u003c/h3>\n\u003cp>先预测：如果暂时删掉 \u003ccode>run\u003c/code> 里保存最终 assistant 的那一步，哪条断言会先出问题？运行时应在第三次请求的历史检查失败。读完后可以在独立练习副本试一次，再恢复。面试时说出测试证明的行为，最后说出它覆盖不到的线上表现。\u003c/p>\n"},{"number":13,"id":"m13","title":"设计判断、当前缺口与十项扩展","goal":"按当前完成项与后续验收点介绍项目。","questions":[],"sections":[{"title":"13.1 从历史演进提炼判断","id":"131-从历史演进提炼判断","search":"13.1 从历史演进提炼判断 最早版本适合观察函数调用原理。现在版把配置和 SDK 放在 CLI，把工具执行入口集中在 `Agent.execute_tool`，让应用工具负责自己的业务校验。旧版自由 shell、`eval` 和行数截断测试已由新版实现替代。旧版源码可从 Git 历史回看。"},{"title":"13.2 已经修好的基线与剩余边界","id":"132-已经修好的基线与剩余边界","search":"13.2 已经修好的基线与剩余边界 这版在工具执行前拒绝截断的模型响应，在工具批次被中断时保持 ID 配对。覆盖文件和执行脚本都需要终端用户确认，并在批准后复查文件状态。会话仍驻留内存，历史持续增长，轮数上限按逻辑模型请求计算。权限策略、会话恢复和上下文管理留给后续扩展。"},{"title":"13.3 十项扩展的依赖和最小验收","id":"133-十项扩展的依赖和最小验收","search":"13.3 十项扩展的依赖和最小验收 | 扩展 | 状态 | 最小验收 |\n|---|---|---|\n| 统一工具执行 | 已有 | 本地函数集中校验，失败回传能配对，同批其他工具仍能继续 |\n| 权限 | 计划 | 同一入口可按能力与目标允许、拒绝或请求确认，拒绝时没有副作用 |\n| 局部编辑 | 计划 | 替换点匹配唯一才写入，零处或多处匹配保留原内容 |\n| 计划模式 | 计划 | 未确认时，执行层禁止写入；批准后进入执行阶段 |\n| 任务清单 | 计划 | 可追踪待做、进行中与完成，并限制非法状态转换 |\n| 会话持久化 | 计划 | 重启可读回历史，保留完整工具调用与结果批次 |\n| 请求追踪 | 计划 | 同一轮可定位模型调用、重试、工具耗时与用量 |\n| 上下文压缩 | 计划 | 保留 system、近期上下文和完整调用批次，达到水位线才触发 |\n| 长期记忆 | 计划 | 能显式写入、查找和删除跨会话记忆，避免随意保存敏感内容 |\n| MCP | 计划 | 接入一个本地服务器，走完发现工具、授权调用、返回结果和关闭连接 |\n\n按你定的节奏，先完成 FitBot，再回到 MiniAgent。回来可先做权限和局部编辑，再做计划与任务；先确定会话数据格式，再做持久化、压缩和记忆；最后让一个 MCP 工具经过同一套授权与执行路径。"},{"title":"13.4 记忆、持久化、压缩与 RAG","id":"134-记忆持久化压缩与-rag","search":"13.4 记忆、持久化、压缩与 RAG 持久化负责重启后恢复这段会话。压缩负责控制这次送入模型的上下文规模。长期记忆负责在以后别的会话使用经选择的信息。FitBot 的 RAG 学习重点是检索外部知识供当前回答使用。四种能力有不同的保存时机、使用时机和评测方法。"},{"title":"13.5 怎样判断架构撑住扩展","id":"135-怎样判断架构撑住扩展","search":"13.5 怎样判断架构撑住扩展 检查新的能力接入后，原来「请求模型 → 校验并执行工具 → 回填结果」的流程能否独立测试。权限应在执行副作用前拦截，压缩应保留协议组块，MCP 远端工具也要进入统一的执行和授权路径。如果一个新需求需要调整边界，就改动对应职责，并用旧用例和新用例验证。"}],"heading":"13 设计判断、当前缺口与十项扩展","slug":"13-设计判断当前缺口与十项扩展","line":2319,"html":"\u003ch3 id=\"131-从历史演进提炼判断\">13.1 从历史演进提炼判断\u003c/h3>\n\u003cp>最早版本适合观察函数调用原理。现在版把配置和 SDK 放在 CLI，把工具执行入口集中在 \u003ccode>Agent.execute_tool\u003c/code>，让应用工具负责自己的业务校验。旧版自由 shell、\u003ccode>eval\u003c/code> 和行数截断测试已由新版实现替代。旧版源码可从 Git 历史回看。\u003c/p>\n\u003ch3 id=\"132-已经修好的基线与剩余边界\">13.2 已经修好的基线与剩余边界\u003c/h3>\n\u003cp>这版在工具执行前拒绝截断的模型响应，在工具批次被中断时保持 ID 配对。覆盖文件和执行脚本都需要终端用户确认，并在批准后复查文件状态。会话仍驻留内存，历史持续增长，轮数上限按逻辑模型请求计算。权限策略、会话恢复和上下文管理留给后续扩展。\u003c/p>\n\u003ch3 id=\"133-十项扩展的依赖和最小验收\">13.3 十项扩展的依赖和最小验收\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>扩展\u003c/th>\n\u003cth>状态\u003c/th>\n\u003cth>最小验收\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>统一工具执行\u003c/td>\n\u003ctd>已有\u003c/td>\n\u003ctd>本地函数集中校验，失败回传能配对，同批其他工具仍能继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>权限\u003c/td>\n\u003ctd>计划\u003c/td>\n\u003ctd>同一入口可按能力与目标允许、拒绝或请求确认，拒绝时没有副作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>局部编辑\u003c/td>\n\u003ctd>计划\u003c/td>\n\u003ctd>替换点匹配唯一才写入，零处或多处匹配保留原内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>计划模式\u003c/td>\n\u003ctd>计划\u003c/td>\n\u003ctd>未确认时，执行层禁止写入；批准后进入执行阶段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务清单\u003c/td>\n\u003ctd>计划\u003c/td>\n\u003ctd>可追踪待做、进行中与完成，并限制非法状态转换\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>会话持久化\u003c/td>\n\u003ctd>计划\u003c/td>\n\u003ctd>重启可读回历史，保留完整工具调用与结果批次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求追踪\u003c/td>\n\u003ctd>计划\u003c/td>\n\u003ctd>同一轮可定位模型调用、重试、工具耗时与用量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上下文压缩\u003c/td>\n\u003ctd>计划\u003c/td>\n\u003ctd>保留 system、近期上下文和完整调用批次，达到水位线才触发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>长期记忆\u003c/td>\n\u003ctd>计划\u003c/td>\n\u003ctd>能显式写入、查找和删除跨会话记忆，避免随意保存敏感内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MCP\u003c/td>\n\u003ctd>计划\u003c/td>\n\u003ctd>接入一个本地服务器，走完发现工具、授权调用、返回结果和关闭连接\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>按你定的节奏，先完成 FitBot，再回到 MiniAgent。回来可先做权限和局部编辑，再做计划与任务；先确定会话数据格式，再做持久化、压缩和记忆；最后让一个 MCP 工具经过同一套授权与执行路径。\u003c/p>\n\u003ch3 id=\"134-记忆持久化压缩与-rag\">13.4 记忆、持久化、压缩与 RAG\u003c/h3>\n\u003cp>持久化负责重启后恢复这段会话。压缩负责控制这次送入模型的上下文规模。长期记忆负责在以后别的会话使用经选择的信息。FitBot 的 RAG 学习重点是检索外部知识供当前回答使用。四种能力有不同的保存时机、使用时机和评测方法。\u003c/p>\n\u003ch3 id=\"135-怎样判断架构撑住扩展\">13.5 怎样判断架构撑住扩展\u003c/h3>\n\u003cp>检查新的能力接入后，原来「请求模型 → 校验并执行工具 → 回填结果」的流程能否独立测试。权限应在执行副作用前拦截，压缩应保留协议组块，MCP 远端工具也要进入统一的执行和授权路径。如果一个新需求需要调整边界，就改动对应职责，并用旧用例和新用例验证。\u003c/p>\n"},{"number":14,"id":"m14","title":"面试表达与场景追问","goal":"用具体调用流程和测试证据回答面试追问。","questions":[],"sections":[{"title":"14.1 三十秒介绍","id":"141-三十秒介绍","search":"14.1 三十秒介绍 > 我用 Python 手写了一个工具调用 Agent。两种 CLI 应用复用同一个运行时，一种做算术和演示查询，另一种在工作区读写文本。我实现了工具说明生成、参数校验、调用和结果配对、最终回答入历史。测试用模拟模型验证了第一项工具失败时后续工具能继续，还用 SDK 的本地 HTTP 替身走通了同轮先写后读。"},{"title":"14.2 两分钟按一个问题展开","id":"142-两分钟按一个问题展开","search":"14.2 两分钟按一个问题展开 可以选「工具失败后，怎么继续这一轮」。先说旧问题，再描述一个实际调用批次。解释为什么要保留相同 `tool_call_id`，以及为什么把校验和异常处理移到 `execute_tool`。最后给一个测试名和它的断言，补一句「线上模型能否选择合适的工具需要另测」。"},{"title":"14.3 面试官常用的六种追问方式","id":"143-面试官常用的六种追问方式","search":"14.3 面试官常用的六种追问方式 | 追问 | 从哪里切入 |\n|---|---|\n| 为什么不直接用 LangGraph？ | 这里想练请求循环、消息协议和工具执行边界；FitBot 用图编排业务流程 |\n| 模型传了坏 JSON 怎么办？ | 单工具失败变成同 ID 的 tool 结果，后续调用继续 |\n| 先写后读依赖顺序，为什么不并行？ | 当前按响应顺序执行；引入并发前需定义依赖和副作用 |\n| 工作区能限制 Python 访问吗？ | 文件工具各自限制路径；Python 子进程拥有当前用户权限 |\n| 重试会重复写文件吗？ | 当前重试只包模型请求；下一轮模型若主动再请求同一工具，仍可能产生新副作用 |\n| MCP 放哪里？ | 先适配工具发现和调用，再让这些工具经过共同校验、授权和结果回传 |"},{"title":"14.4 三个现场演练","id":"144-三个现场演练","search":"14.4 三个现场演练 1. 画出第一轮返回两个调用、第二轮给最终回答后的历史。\n2. 解释从模型传入 `overwrite=True` 到用户批准后复查、替换文件的全过程。举例说明用户批准后文件发生变化时会怎样。\n3. 用一个具体输入说明 API 请求轮数、底层请求尝试、工具调用数分别怎么计数。"},{"title":"14.5 不知道时怎样答","id":"145-不知道时怎样答","search":"14.5 不知道时怎样答 如果问到线上任务成功率，可以说明当前跑了哪些离线回归、样本是否来自实际模型、下一步会用哪些任务和预期结果来评测。把证据和推测放在不同的句子里。"}],"heading":"14 面试表达与场景追问","slug":"14-面试表达与场景追问","line":2362,"html":"\u003ch3 id=\"141-三十秒介绍\">14.1 三十秒介绍\u003c/h3>\n\u003cblockquote>\n\u003cp>我用 Python 手写了一个工具调用 Agent。两种 CLI 应用复用同一个运行时，一种做算术和演示查询，另一种在工作区读写文本。我实现了工具说明生成、参数校验、调用和结果配对、最终回答入历史。测试用模拟模型验证了第一项工具失败时后续工具能继续，还用 SDK 的本地 HTTP 替身走通了同轮先写后读。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"142-两分钟按一个问题展开\">14.2 两分钟按一个问题展开\u003c/h3>\n\u003cp>可以选「工具失败后，怎么继续这一轮」。先说旧问题，再描述一个实际调用批次。解释为什么要保留相同 \u003ccode>tool_call_id\u003c/code>，以及为什么把校验和异常处理移到 \u003ccode>execute_tool\u003c/code>。最后给一个测试名和它的断言，补一句「线上模型能否选择合适的工具需要另测」。\u003c/p>\n\u003ch3 id=\"143-面试官常用的六种追问方式\">14.3 面试官常用的六种追问方式\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>追问\u003c/th>\n\u003cth>从哪里切入\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>为什么不直接用 LangGraph？\u003c/td>\n\u003ctd>这里想练请求循环、消息协议和工具执行边界；FitBot 用图编排业务流程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型传了坏 JSON 怎么办？\u003c/td>\n\u003ctd>单工具失败变成同 ID 的 tool 结果，后续调用继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>先写后读依赖顺序，为什么不并行？\u003c/td>\n\u003ctd>当前按响应顺序执行；引入并发前需定义依赖和副作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作区能限制 Python 访问吗？\u003c/td>\n\u003ctd>文件工具各自限制路径；Python 子进程拥有当前用户权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重试会重复写文件吗？\u003c/td>\n\u003ctd>当前重试只包模型请求；下一轮模型若主动再请求同一工具，仍可能产生新副作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MCP 放哪里？\u003c/td>\n\u003ctd>先适配工具发现和调用，再让这些工具经过共同校验、授权和结果回传\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"144-三个现场演练\">14.4 三个现场演练\u003c/h3>\n\u003col>\n\u003cli>画出第一轮返回两个调用、第二轮给最终回答后的历史。\u003c/li>\n\u003cli>解释从模型传入 \u003ccode>overwrite=True\u003c/code> 到用户批准后复查、替换文件的全过程。举例说明用户批准后文件发生变化时会怎样。\u003c/li>\n\u003cli>用一个具体输入说明 API 请求轮数、底层请求尝试、工具调用数分别怎么计数。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"145-不知道时怎样答\">14.5 不知道时怎样答\u003c/h3>\n\u003cp>如果问到线上任务成功率，可以说明当前跑了哪些离线回归、样本是否来自实际模型、下一步会用哪些任务和预期结果来评测。把证据和推测放在不同的句子里。\u003c/p>\n"},{"number":15,"id":"m15","title":"每日复习路线与维护卡","goal":"按十四次路线小步复习并维护自己的疑问记录。","questions":[],"sections":[{"title":"15.1 十四次学习任务","id":"151-十四次学习任务","search":"15.1 十四次学习任务 | 次数 | 目标 | 阅读 | 做题 |\n|---|---|---|---|\n| 1 | 画出架构地图 | [01.2 先看职责，再看文件](#012-先看职责再看文件) | [M01-A01](#m01-a01-基础识别) · [M01-B02](#m01-b02-代码推演) |\n| 2 | 读懂函数与数据 | [02.2 函数对象与函数调用](#022-函数对象与函数调用) | [M02-A02](#m02-a02-基础识别) · [M02-B01](#m02-b01-代码推演) |\n| 3 | 走一遍启动过程 | [03.2 import 会执行哪些事](#032-import-会执行哪些事) | [M03-A02](#m03-a02-基础识别) · [M03-B02](#m03-b02-代码推演) |\n| 4 | 手工生成工具说明 | [04.3 从一个有默认参数的例子推导](#043-从一个有默认参数的例子推导) | [M04-A02](#m04-a02-基础识别) · [M04-B01](#m04-b01-代码推演) |\n| 5 | 推导实例状态 | [05.3 两个实例为什么不串历史](#053-两个实例为什么不串历史) | [M05-A01](#m05-a01-基础识别) · [M05-B01](#m05-b01-代码推演) |\n| 6 | 走通正常工具循环 | [06.4 工具分支逐步手推](#064-工具分支逐步手推) | [M06-A03](#m06-a03-基础识别) · [M06-B01](#m06-b01-代码推演) |\n| 7 | 检查最终回答、失败与终止 | [06.6 最终回答怎样进入历史](#066-最终回答怎样进入历史) | [M06-B03](#m06-b03-代码推演) · [M06-C02](#m06-c02-面试追问) |\n| 8 | 辨清演示工具能力 | [07.2 天气工具就是字典查询](#072-天气工具就是字典查询) | [M07-A01](#m07-a01-基础识别) · [M07-B03](#m07-b03-代码推演) |\n| 9 | 理解文件路径与读写 | [08.2 路径检查究竟做了哪两件事](#082-路径检查究竟做了哪两件事) | [M08-B01](#m08-b01-代码推演) · [M08-B03](#m08-b03-代码推演) |\n| 10 | 解释脚本启动与权限 | [09.3 subprocess 的参数各管一件事](#093-subprocess-的参数各管一件事) | [M09-A02](#m09-a02-基础识别) · [M09-C01](#m09-c01-面试追问) |\n| 11 | 计算重试和日志 | [10.3 手推默认的三次机会](#103-手推默认的三次机会) · [再看日志的落盘路径](#112-从字段到磁盘的一条路径) | [M10-B01](#m10-b01-代码推演) · [M10-C01](#m10-c01-面试追问) · [M11-B02](#m11-b02-代码推演) |\n| 12 | 拆解预设模型与历史断言 | [12.2 unittest 怎样找到测试](#122-unittest-怎样找到测试) · [再看历史断言](#124-如何读同轮多工具与历史断言) | [M12-A03](#m12-a03-基础识别) · [M12-B03](#m12-b03-代码推演) |\n| 13 | 手推重试与预期异常 | [12.8 怎样手推 flaky 和重试断言](#128-怎样手推-flaky-和重试断言) | [M12-B04](#m12-b04-代码推演) · [M10-B01](#m10-b01-代码推演) |\n| 14 | 口述项目并接追问 | [14.1 三十秒介绍](#141-三十秒介绍) · [核对已完成项与执行边界](#132-已经修好的基线与剩余边界) | 口述三十秒介绍 |"},{"title":"15.2 每次只记录三个短句","id":"152-每次只记录三个短句","search":"15.2 每次只记录三个短句 记录「我能解释的一个流程」「我能预测的一个边界」「我下次要验证的一个疑问」。例如，第一轮两次工具调用会保留同一条 assistant；首轮请求失败会移除用户消息；下一次查清后续轮失败为什么保留历史。"},{"title":"15.3 十五分钟面试热身","id":"153-十五分钟面试热身","search":"15.3 十五分钟面试热身 三分钟画架构，五分钟手推调用和错误分支，五分钟口述一个验证用例，最后两分钟讲清当前执行边界与计划。"},{"title":"15.4 代码更新时同步哪些地方","id":"154-代码更新时同步哪些地方","search":"15.4 代码更新时同步哪些地方 先看 README 的运行命令和能力表，再看相应章节、题库和 HTML 目录。改了测试时也要改第 12 章的示例和断言说明。遇到扩展新增状态时，把「计划」和「通过了哪些验收」写清楚。"},{"title":"15.5 需要进一步查证时","id":"155-需要进一步查证时","search":"15.5 需要进一步查证时 从源码和离线用例找本项目行为，从服务官方文档查供应商协议，从真实请求或独立评测验证模型表现。 [DeepSeek 工具调用文档](https://api-docs.deepseek.com/guides/tool_calls/)"}],"heading":"15 每日复习路线与维护卡","slug":"15-每日复习路线与维护卡","line":2401,"html":"\u003ch3 id=\"151-十四次学习任务\">15.1 十四次学习任务\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>次数\u003c/th>\n\u003cth>目标\u003c/th>\n\u003cth>阅读\u003c/th>\n\u003cth>做题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>画出架构地图\u003c/td>\n\u003ctd>\u003ca href=\"#012-%E5%85%88%E7%9C%8B%E8%81%8C%E8%B4%A3%E5%86%8D%E7%9C%8B%E6%96%87%E4%BB%B6\">01.2 先看职责，再看文件\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#m01-a01-%E5%9F%BA%E7%A1%80%E8%AF%86%E5%88%AB\">M01-A01\u003c/a> · \u003ca href=\"#m01-b02-%E4%BB%A3%E7%A0%81%E6%8E%A8%E6%BC%94\">M01-B02\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>读懂函数与数据\u003c/td>\n\u003ctd>\u003ca href=\"#022-%E5%87%BD%E6%95%B0%E5%AF%B9%E8%B1%A1%E4%B8%8E%E5%87%BD%E6%95%B0%E8%B0%83%E7%94%A8\">02.2 函数对象与函数调用\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#m02-a02-%E5%9F%BA%E7%A1%80%E8%AF%86%E5%88%AB\">M02-A02\u003c/a> · \u003ca href=\"#m02-b01-%E4%BB%A3% function questionCard(q){return '<article class="qa" id="'+q.anchor+'" data-question="'+q.id+'"><div class="qa-top"><span class="qa-code">'+q.id.toUpperCase()+'</span><span class="badge '+q.level+'">'+q.level+' · '+label[q.level]+'</span><label class="master"><input type="checkbox" data-master="'+q.id+'" '+(store.mastered.includes(q.id)?'checked':'')+'>自标掌握</label></div><p class="question-title">'+esc(q.question)+'</p><details><summary>展开参考答案</summary><div class="answer">'+q.answerHtml+'</div>'+(q.followup?'<div class="followup"><strong>继续追问</strong>'+q.followupHtml+'</div>':'')+'</details></article>'}
function practice(m){return m.questions.length?'<section class="practice" id="practice-'+m.id+'"><h2>本模块十二题</h2><p>A 基础识别、B 代码推演、C 面试追问各四题。先回答再展开；自标掌握不代表自动评分。</p><div class="question-grid">'+m.questions.map(questionCard).join('')+'</div></section>':''}
function moduleHtml(m,all=false){return '<section class="sheet '+(all?'all-sheet':'')+'" id="'+m.id+'"><header class="module-header"><div class="eyebrow">MODULE '+String(m.number).padStart(2,'0')+' / SOURCE WALKTHROUGH</div><h1>'+esc(m.title)+'</h1><div class="goal"><strong>学完能做什么：</strong> '+esc(m.goal)+'</div>'+(!all?'<div class="module-actions">'+(m.questions.length?'<a class="button soft" href="'+href(m.questions[0].anchor)+'">本模块 12 题 ↓</a>':'')+'<a class="button" href="#daily">每日路线</a><a class="button" href="#questions">按难度练习</a></div>':'')+'</header><details class="toc"><summary>本模块小节目录 · '+m.sections.length+' 节</summary>'+m.sections.map(s=>'<a href="'+href(s.id)+'">'+esc(s.title)+'</a>').join('')+'</details><div class="article">'+m.html+'</div>'+practice(m)+'</section>'}
function showModule(n){mode='module';current=n;const m=modules[n];setHeading('源码手册 / '+String(n).padStart(2,'0')+' '+m.title);content.innerHTML=moduleHtml(m)+'<div class="bottom">'+(n>0?'<a class="button" href="'+href(modules[n-1].id)+'">← 上一模块</a>':'<span></span>')+'<a class="button" href="#home">返回导览</a>'+(n<15?'<a class="button" href="'+href(modules[n+1].id)+'">下一模块 →</a>':'<span></span>')+'</div>'}
function daily(){mode='daily';current=null;setHeading('每日复习 / 十四次小步学习');const done=store.days.length;content.innerHTML=titleBlock('SMALL STEPS. CLEAR STOPPING POINTS.','每天学一点，<br>每次知道自己学会了什么。','建议每次 10–20 分钟，允许拆开完成。先回忆，再读一个小节，做两道题；今天留下的疑点就是明天的起点。')+'<div class="progress"><span style="width:'+(done/14*100)+'%"></span></div><p class="hint" id="daily-count" style="font-size:12px;color:var(--muted)">已自标完成 '+done+' / 14 次</p>'+book.daily.map(d=>'<section class="daily-card '+(store.days.includes(d.number)?'done':'')+'"><label class="daily-check"><input type="checkbox" aria-label="完成第 '+d.number+' 次学习" data-day="'+d.number+'" '+(store.days.includes(d.number)?'checked':'')+'></label><div class="daily-content"><div class="day">SESSION '+String(d.number).padStart(2,'0')+'</div><h3>'+esc(d.title)+'</h3><p>'+esc(modules[d.module].goal)+'</p><div class="daily-links"><a href="'+href(d.target)+'">阅读这一节 ↗</a>'+(d.extra||[]).map(extra=>'<a href="'+href(extra.id)+'">'+esc(extra.title)+' ↗</a>').join('')+d.questions.map(id=>{const q=questionsById.get(id);return '<a href="'+href(q.anchor)+'">'+id.toUpperCase()+' ↗</a>'}).join('')+'</div></div></section>').join('')+'<div class="note">完成标准：不看文档，能说出输入、状态变化、输出和一个边界。进度由你自己标记，既不自动评分，也不限制阅读其他模块。</div>';syncNav('daily')}
function renderBank(){mode='questions';current=null;setHeading('分档题库 / 144 题');content.innerHTML=titleBlock('RECALL FIRST. REVEAL LATER.','不是背答案，<br>是练习从代码推出结论。','A 解释基础，B 预测执行，C 讨论取舍与验证。先口述再展开答案；每题都来自当前项目的职责、语句或真实缺口。')+'<div class="filters"><select id="module-filter" aria-label="按模块筛题"><option value="all">全部 12 个模块</option>'+modules.filter(m=>m.questions.length).map(m=>'<option value="'+m.number+'" '+(String(m.number)===bankModule?'selected':'')+'>'+String(m.number).padStart(2,'0')+' '+esc(m.title)+'</option>').join('')+'</select>'+['all','A','B','C'].map(level=>'<button class="level-button '+(bankLevel===level?'active':'')+'" data-level="'+level+'">'+(level==='all'?'全部难度':level+' '+label[level])+'</button>').join('')+'<label class="filter-check"><input id="only-new" type="checkbox" '+(onlyNew?'checked':'')+'>只看未自标掌握</label><button id="random" class="button">抽 5 题</button><button id="reset-random" class="button">显示全部</button><span id="result-count" class="result-count"></span></div><div id="question-list" class="question-grid"></div>';filterBank();syncNav('questions');$('module-filter').onchange=e=>{bankModule=e.target.value;randomIds=null;filterBank()};$('only-new').onchange=e=>{onlyNew=e.target.checked;randomIds=null;filterBank()};$('random').onclick=()=>{const base=filteredQuestions(false);randomIds=[...base].sort(()=>Math.random()-.5).slice(0,5).map(q=>q.id);filterBank()};$('reset-random').onclick=()=>{randomIds=null;filterBank()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{bankLevel=b.dataset.level;randomIds=null;document.querySelectorAll('[data-level]').forEach(item=>item.classList.toggle('active',item===b));filterBank()})}
function filteredQuestions(useRandom=true){return allQuestions.filter(q=>(bankModule==='all'||q.module===Number(bankModule))&&(bankLevel==='all'||q.level===bankLevel)&&(!onlyNew||!store.mastered.includes(q.id))&&(!useRandom||!randomIds||randomIds.includes(q.id)))}
function filterBank(){const list=filteredQuestions();$('question-list').innerHTML=list.length?list.map(questionCard).join(''):'<div class="empty">当前条件下没有题目。可更换模块、难度，或取消“只看未自标掌握”。</div>';$('result-count').textContent='当前 '+list.length+' 题 / 自标掌握 '+store.mastered.length+' 题'}
function showAll(){mode='all';current=null;setHeading('全文阅读 / 可使用浏览器查找');content.innerHTML='<div class="full-label">全文包含 16 个模块和 144 题。答案保持折叠；按模块阅读可减少一次看到的内容。</div>'+modules.map(m=>moduleHtml(m,true)).join('');syncNav('all')}
function normalize(id){let value=id;const seen=new Set();while(alias[value]&&!seen.has(value)){seen.add(value);value=alias[value]}return value}
function remember(id){const n=owner.get(id);if(n===undefined)return;const m=modules[n],section=m.sections.find(s=>s.id===id),q=m.questions.find(q=>q.anchor===id);store.last={id,title:q?q.id.toUpperCase():section?section.title:m.title};save()}
function go(raw,update=true){let id=normalize(raw||'home');closeMenu();if(id==='home')home();else if(id==='daily')daily();else if(id==='questions')renderBank();else if(id==='all')showAll();else if(owner.has(id)){const n=owner.get(id);if(mode!=='all'&&(mode!=='module'||current!==n))showModule(n);current=n;syncNav(id);remember(id)}else{id='home';home()};if(update)history.pushState(null,'',href(id));if(owner.has(id)){requestAnimationFrame(()=>{const node=$(id);if(node)node.scrollIntoView({block:'start',behavior:'instant'})})}else window.scrollTo({top:0,behavior:'instant'})}
function doSearch(){const query=search.value.trim().toLocaleLowerCase();if(!query){resultBox.hidden=true;return}const hits=[];for(const m of modules){if(m.title.toLocaleLowerCase().includes(query))hits.push({id:m.id,title:m.title,context:'模块 '+String(m.number).padStart(2,'0')});for(const s of m.sections)if((s.title+' '+s.search).toLocaleLowerCase().includes(query))hits.push({id:s.id,title:s.title,context:'模块 '+String(m.number).padStart(2,'0')+' · 小节'});for(const q of m.questions)if((q.id+' '+q.question+' '+q.answer+' '+q.followup).toLocaleLowerCase().includes(query))hits.push({id:q.anchor,title:q.question,context:q.id.toUpperCase()+' · '+label[q.level]})}resultBox.hidden=false;resultBox.innerHTML='<h2>搜索结果 · '+hits.length+' 处</h2>'+(hits.length?hits.slice(0,25).map(h=>'<a href="'+href(h.id)+'"><small>'+esc(h.context)+'</small>'+esc(h.title)+'</a>').join(''):'<p>未找到内容。试试函数名、题号，或“历史”“路径”“execute_tool”。</p>');window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;let target;try{target=decodeURIComponent(a.getAttribute('href').slice(1))}catch{target='home'}e.preventDefault();if(a.closest('#results')){search.value='';resultBox.hidden=true}go(target)});
document.addEventListener('change',e=>{const master=e.target.dataset.master;if(master){store.mastered=store.mastered.filter(id=>id!==master);if(e.target.checked)store.mastered.push(master);save();if(mode==='questions'){if(onlyNew)filterBank();else $('result-count').textContent='当前 '+filteredQuestions().length+' 题 / 自标掌握 '+store.mastered.length+' 题'}}const day=e.target.dataset.day;if(day){const n=Number(day);store.days=store.days.filter(id=>id!==n);if(e.target.checked)store.days.push(n);save();e.target.closest('.daily-card').classList.toggle('done',e.target.checked);document.querySelector('.progress span').style.width=(store.days.length/14*100)+'%';$('daily-count').textContent='已自标完成 '+store.days.length+' / 14 次'}});
$('full').onclick=()=>{if(mode==='all'){const target=current===null?'m01':modules[current].id;mode='reset';go(target)}else go('all')};search.addEventListener('input',doSearch);$('menu').onclick=()=>{$('sidebar').classList.toggle('shown');$('overlay').classList.toggle('shown')};$('overlay').onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();search.focus();$('sidebar').classList.add('shown');if(innerWidth<761)$('overlay').classList.add('shown')}if(e.key==='Escape'){search.value='';resultBox.hidden=true;search.blur();closeMenu()}});
const readHash=()=>{try{return decodeURIComponent(location.hash.slice(1))}catch{return 'home'}};window.addEventListener('popstate',()=>go(readHash(),false));window.addEventListener('hashchange',()=>go(readHash(),false));if(store.last)store.last.id=normalize(store.last.id);initNav();go(readHash(),false);
</script></body></html>
